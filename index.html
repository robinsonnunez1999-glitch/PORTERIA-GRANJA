  // ---------- HORARIO DE TRABAJO (carga desde Excel) y COMPARATIVA con la asistencia ----------
  // Códigos del cronograma: A = jornada (asistencia programada) · L = libre · V = vacaciones · P = permiso · F = falta · E = extra.
  // También se entiende el formato anterior (casillas con número = día de trabajo).

  const MESES_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DIA_CLAVES = ['dom','lun','mar','mie','jue','vie','sab'];     // posición = getDay()
  const DIAS_LARGO = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const COLOR_COD = {A:'FF00FF00', L:'FF00FFFF', V:'FFDD7E6B', P:'FF0000FF', F:'FFFF0000', E:'FFFFFF00'};   // los mismos colores del formato

  function p2(n){ return String(n).padStart(2,'0'); }
  function nombreMes(ym){
    const a = ym.split('-').map(Number);
    return cap(new Date(a[0], a[1]-1, 1).toLocaleDateString('es-EC',{month:'long', year:'numeric'}));
  }
  function normNombre(s){
    return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  }
  function diasDelMes(y, m){ return new Date(y, m, 0).getDate(); }
  function colLetra(n){ let s = ''; while(n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }

  // Los lectores/escritores de Excel se descargan solo cuando se usan.
  function cargarScript(urls, listo){
    if(listo()) return Promise.resolve();
    return urls.reduce((p, u)=> p.catch(()=> new Promise((res, rej)=>{
      const s = document.createElement('script');
      s.src = u; s.onload = ()=> (listo() ? res() : rej()); s.onerror = ()=> rej();
      document.head.appendChild(s);
    })), Promise.reject()).catch(()=>{ throw new Error('No se pudo cargar el complemento de Excel. Revisa tu internet.'); });
  }
  function loadXlsxLib(){
    return cargarScript(['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'], ()=> !!window.XLSX);
  }
  function loadExcelJs(){
    return cargarScript(['https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js','https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'], ()=> !!window.ExcelJS);
  }

  function fechaDeCelda(v){
    if(v == null || v === '') return null;
    if(v instanceof Date) return fmtDate(v);
    if(typeof v === 'number'){
      if(v > 30000 && v < 80000){
        const d = new Date(Math.round((v - 25569) * 86400000));       // número de serie de Excel
        return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate());
      }
      return null;
    }
    const s = String(v).trim();
    let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);       // dd/mm/aaaa
    if(m) return m[3]+'-'+p2(m[2])+'-'+p2(m[1]);
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return m[1]+'-'+m[2]+'-'+m[3];
    return null;
  }

  function claveDiaSemana(v){
    if(typeof v !== 'string') return -1;
    const t = normNombre(v);
    if(!t || t.length > 10) return -1;
    return DIA_CLAVES.indexOf(t.slice(0,3));
  }
  function codigoCelda(v){
    if(v == null || v === '') return '';
    if(typeof v === 'number') return 'A';               // formato anterior: un número es un día de trabajo
    return String(v).trim().toUpperCase().slice(0,3);
  }
  function mesDeTexto(t){ const n = normNombre(t); for(let i = 0; i < 12; i++){ if(n.includes(MESES_ES[i])) return i + 1; } return 0; }
  function anioDeTexto(t){ const m = String(t || '').match(/\b(20\d{2})\b/); return m ? Number(m[1]) : 0; }

  // Mes y año del cronograma: primero una fecha real del encabezado, luego el nombre de la hoja
  // (los títulos de las celdas suelen quedar con meses viejos). El año se elige para que los días de la semana coincidan.
  function inferirMes(nombreHoja, aoa, hdr, n, primerDia){
    let mes = 0, anio = 0;
    for(let i = 0; i < Math.min(hdr, 6) && !mes; i++){
      (aoa[i] || []).forEach(v=>{
        if(!mes && typeof v === 'number' && v > 36500 && v < 73000){ const f = fechaDeCelda(v); if(f){ anio = +f.slice(0,4); mes = +f.slice(5,7); } }
      });
    }
    if(!mes){ mes = mesDeTexto(nombreHoja); if(mes) anio = anioDeTexto(nombreHoja); }
    if(!mes){
      for(let i = 0; i < Math.min(hdr, 6) && !mes; i++){
        (aoa[i] || []).forEach(v=>{ if(!mes && typeof v === 'string'){ const m = mesDeTexto(v); if(m){ mes = m; anio = anioDeTexto(v); } } });
      }
    }
    const hoy = new Date(), cy = hoy.getFullYear();
    const coincide = (y, m)=> diasDelMes(y, m) === n && new Date(y, m-1, 1).getDay() === primerDia;
    if(mes){
      if(!anio){
        anio = [cy, cy+1, cy-1].find(y=> coincide(y, mes)) || cy;
      }
    } else {
      for(let k = -1; k <= 12 && !mes; k++){
        const d = new Date(cy, hoy.getMonth() + k, 1);
        if(coincide(d.getFullYear(), d.getMonth() + 1)){ mes = d.getMonth() + 1; anio = d.getFullYear(); }
      }
      if(!mes){ mes = hoy.getMonth() + 1; anio = cy; }
    }
    return {mes:mes, anio:anio};
  }

  // Formato con la fila de días de la semana (DOM, LUN, MAR...) y los códigos A/L/V/P en cada día.
  function parseHojaSemana(aoa, nombreHoja, hdr, cols){
    const n = cols.length, primerCol = cols[0].j, primerDia = cols[0].k;
    // ¿hay una fila de fechas confiable cerca? (en el formato base suele quedar con fechas viejas o vacías)
    let fechasArchivo = null;
    [hdr + 1, hdr + 2, hdr - 1].forEach(i=>{
      if(fechasArchivo || i < 0 || i >= aoa.length) return;
      const f = cols.map(c=> fechaDeCelda((aoa[i] || [])[c.j]));
      const buenas = f.filter(x=> x && +x.slice(0,4) >= 2000).length;
      if(buenas >= Math.ceil(n * 0.7)){
        const k0 = f.findIndex(x=> x && +x.slice(0,4) >= 2000);
        const base = addDays(f[k0], -k0);
        fechasArchivo = cols.map((_, k)=> addDays(base, k));
      }
    });
    let mes, anio;
    if(fechasArchivo){ mes = +fechasArchivo[0].slice(5,7); anio = +fechasArchivo[0].slice(0,4); }
    else { const im = inferirMes(nombreHoja, aoa, hdr, n, primerDia); mes = im.mes; anio = im.anio; }

    // columnas de nombre, línea de negocio y cargo (por su encabezado)
    let cNom = -1, cLin = -1, cCar = -1;
    for(let i = Math.max(0, hdr - 1); i <= Math.min(aoa.length - 1, hdr + 3); i++){
      (aoa[i] || []).forEach((v, j)=>{
        if(j >= primerCol || typeof v !== 'string') return;
        const t = normNombre(v);
        if(cNom < 0 && t.startsWith('nombre')) cNom = j;
        if(cLin < 0 && t.includes('linea')) cLin = j;
        if(cCar < 0 && t.startsWith('cargo')) cCar = j;
      });
    }
    if(cNom < 0) cNom = (primerCol >= 2 ? 1 : 0);

    const filas = [];
    for(let i = hdr + 1; i < aoa.length; i++){
      const row = aoa[i] || [];
      const nombre = typeof row[cNom] === 'string' ? row[cNom].trim() : '';
      if(!nombre) continue;
      if(/^(nombre|total|programad|asistieron|operadores|operacion|cargo|linea)/.test(normNombre(nombre))) continue;
      const codigos = cols.map(c=> codigoCelda(row[c.j]));
      if(codigos.filter(x=> x).length < 3) continue;
      filas.push({
        name: nombre,
        cargo: (cCar >= 0 && typeof row[cCar] === 'string') ? row[cCar].trim() : '',
        linea: (cLin >= 0 && typeof row[cLin] === 'string') ? row[cLin].trim() : '',
        codigos: codigos
      });
    }
    return {hoja:nombreHoja, n:n, primerDia:primerDia, fechasArchivo:fechasArchivo, mes:mes, anio:anio, filas:filas};
  }

  // Formato anterior: sin fila de días de la semana, solo una fila de fechas (dd/mm/aaaa).
  function parseHojaFechas(aoa, nombreHoja){
    let hdr = -1, best = 0;
    aoa.forEach((row, i)=>{ const k = (row || []).filter(c=> fechaDeCelda(c)).length; if(k > best){ best = k; hdr = i; } });
    if(hdr < 0 || best < 5) return null;
    const cols = []; let primera = Infinity;
    (aoa[hdr] || []).forEach((c, j)=>{ const f = fechaDeCelda(c); if(f){ cols.push({j:j, f:f}); primera = Math.min(primera, j); } });
    const filas = [];
    for(let i = hdr + 1; i < aoa.length; i++){
      const row = aoa[i] || [];
      const textos = [];
      for(let j = 0; j < primera; j++){ const v = row[j]; if(typeof v === 'string' && v.trim()) textos.push(v.trim()); }
      if(!textos.length) continue;
      const nombre = textos[0], cargo = textos[1] || '';
      if(/operadores|operaci[oó]n|total|nombre/i.test(nombre) || /operadores|operaci[oó]n|total/i.test(cargo)) continue;
      const codigos = cols.map(c=> codigoCelda(row[c.j]));
      if(codigos.filter(x=> x).length < 3) continue;
      filas.push({name:nombre, cargo:cargo, linea:'', codigos:codigos});
    }
    const fechas = cols.map(c=> c.f);
    return {hoja:nombreHoja, n:fechas.length, primerDia:parseDate(fechas[0]).getDay(), fechasArchivo:fechas,
            mes:+fechas[0].slice(5,7), anio:+fechas[0].slice(0,4), filas:filas};
  }

  function parseHoja(aoa, nombreHoja){
    let hdr = -1, cols = [];
    aoa.forEach((row, i)=>{
      const c = [];
      (row || []).forEach((v, j)=>{ const k = claveDiaSemana(v); if(k >= 0) c.push({j:j, k:k}); });
      if(c.length > cols.length){ cols = c; hdr = i; }
    });
    if(cols.length >= 14) return parseHojaSemana(aoa, nombreHoja, hdr, cols);
    return parseHojaFechas(aoa, nombreHoja);
  }

  async function leerHorarioArchivo(file){
    await loadXlsxLib();
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    const cands = []; let ultimo = null;
    wb.SheetNames.forEach(nombre=>{
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[nombre], {header:1, raw:true, defval:null});
      try{ const c = parseHoja(aoa, nombre); if(c && c.filas.length) cands.push(c); }catch(e){ ultimo = e; }
    });
    if(!cands.length) throw ultimo || new Error('No encontré personas con su horario. Revisa que cada fila tenga el nombre y el código de cada día (A, L, V, P).');
    return cands;
  }

  // Fechas de cada columna de día, según el mes y el año elegidos.
  function fechasDe(c){
    if(c.fechasArchivo) return c.fechasArchivo.slice();
    const dm = diasDelMes(c.anio, c.mes), out = [];
    for(let i = 0; i < Math.min(c.n, dm); i++) out.push(fmtDate(new Date(c.anio, c.mes - 1, 1 + i)));
    return out;
  }
  function avisoMes(c){
    if(c.fechasArchivo) return '';
    const dm = diasDelMes(c.anio, c.mes);
    if(new Date(c.anio, c.mes - 1, 1).getDay() !== c.primerDia)
      return 'Los días de la semana del archivo (empieza en '+DIAS_LARGO[c.primerDia].toLowerCase()+') no coinciden con '+nombreMes(c.anio+'-'+p2(c.mes))+'. Revisa el mes y el año.';
    if(c.n !== dm) return 'El archivo trae '+c.n+' columnas de días y '+nombreMes(c.anio+'-'+p2(c.mes))+' tiene '+dm+'.';
    return '';
  }

  // Sugiere a qué persona de la lista corresponde cada nombre del horario.
  function sugerirStaff(nombre){
    const n = normNombre(nombre), toks = n.split(' ');
    const exactos = state.staff.filter(p=> normNombre(p.name) === n);
    if(exactos.length === 1) return {id: exactos[0].id, posibles: []};
    const cand = state.staff.filter(p=>{
      const pt = normNombre(p.name).split(' ');
      return toks.every(t=> pt.includes(t)) || pt.every(t=> toks.includes(t));
    });
    if(cand.length === 1) return {id: cand[0].id, posibles: []};
    const posibles = state.staff.filter(p=> normNombre(p.name).split(' ').some(t=> t.length > 2 && toks.includes(t))).map(p=>p.id);
    return {id: '', posibles: posibles};
  }

  function armarPrevia(archivo, cands){
    const hoy = new Date();
    const ym = (d)=> d.getFullYear()*100 + d.getMonth() + 1;
    const actual = ym(hoy), siguiente = ym(new Date(hoy.getFullYear(), hoy.getMonth() + 1, 1));
    let sel = cands.findIndex(c=> c.anio*100 + c.mes === actual);
    if(sel < 0) sel = cands.findIndex(c=> c.anio*100 + c.mes === siguiente);
    if(sel < 0) sel = cands.length - 1;
    cands.forEach(c=>{
      c.filas.forEach(f=>{ const s = sugerirStaff(f.name); f.staffId = s.id; f.posibles = s.posibles; });
    });
    return {archivo:archivo, sel:sel, cands:cands};
  }

  async function guardarHorario(prev){
    const c = prev.cands[prev.sel];
    const fechas = fechasDe(c);
    const porMes = {};
    c.filas.forEach(f=>{
      if(!f.staffId) return;
      fechas.forEach((d, i)=>{
        const cod = f.codigos[i];
        if(!cod) return;
        const ym = d.slice(0,7);
        porMes[ym] = porMes[ym] || {};
        const o = porMes[ym][f.staffId] = porMes[ym][f.staffId] || {staffId:f.staffId, name:f.name, cargo:f.cargo || '', linea:f.linea || '', days:{}};
        o.days[d] = cod;
      });
    });
    const meses = Object.keys(porMes).sort();
    if(!meses.length){ showToast('Asigna al menos una persona antes de guardar.'); return; }
    const lineas = c.filas.map(f=> f.linea).filter(x=> x);
    const linea = lineas.length ? lineas.sort((a,b)=> lineas.filter(v=>v===b).length - lineas.filter(v=>v===a).length)[0] : '';
    state.horarioGuardando = true; render();
    try{
      for(let i = 0; i < meses.length; i++){
        const ym = meses[i];
        await db.collection(COL.meta).doc('horario_'+ym).set({
          rows: Object.keys(porMes[ym]).map(k=> porMes[ym][k]),
          linea: linea, hoja: c.hoja, archivo: prev.archivo,
          subido: new Date().toISOString(),
          por: (state.session && state.session.nombre) || ''
        });
      }
      showToast('Horario guardado: '+meses.map(nombreMes).join(', '));
      registrarAuditoria('horario_cargado', meses.map(nombreMes).join(', ')+' · '+c.filas.filter(f=> f.staffId).length+' personas · archivo '+prev.archivo+' (hoja '+c.hoja+')', meses[0]+'-01');
      state.horarioPrevia = null; state.horarioCache = {}; state.horarioFailed = {}; state.horariosLista = null;
    }catch(e){
      showToast('No se pudo guardar el horario. Revisa tu internet.');
    }
    state.horarioGuardando = false; render();
  }

  async function loadHorariosLista(){
    if(state.horariosLista !== null || state.horarioListaCargando) return;
    state.horarioListaCargando = true;
    try{
      const FP = firebase.firestore.FieldPath.documentId();
      const snap = await db.collection(COL.meta).where(FP,'>=','horario_').where(FP,'<=','horario_\uf8ff').get();
      state.horariosLista = snap.docs.map(d=>({ym: d.id.replace('horario_',''), n: ((d.data() && d.data().rows) || []).length})).sort((a,b)=> a.ym.localeCompare(b.ym));
    }catch(e){ state.horariosLista = []; }
    state.horarioListaCargando = false;
    render();
  }

  async function loadHorarioMes(ym){
    if(state.horarioCache[ym] !== undefined || state.horarioLoading[ym]) return;
    state.horarioLoading[ym] = true;
    try{
      const snap = await db.collection(COL.meta).doc('horario_'+ym).get();
      state.horarioCache[ym] = snap.exists ? snap.data() : null;
      delete state.horarioFailed[ym];
    }catch(e){
      state.horarioFailed[ym] = true;
      showToast('No se pudo cargar el horario. Revisa tu internet.');
    }
    delete state.horarioLoading[ym];
    render();
  }

  // ---- Pestaña Nómina → Comparativa: días programados contra días asistidos ----
  function tipoProg(v){
    if(typeof v === 'number') return 'T';
    const t = String(v || '').toUpperCase();
    if(t === 'A' || t === 'F') return 'T';          // jornada programada (F = falta ya marcada en el cronograma)
    if(t === 'L') return 'L';
    if(t === 'V') return 'V';
    if(t === 'P') return 'P';
    return t ? 'O' : '';
  }
  const NOM_EST = {ok:'Asistió', falta:'Falta', justif:'Falta justificada', hoy:'Hoy: aún no registra entrada', prog:'Le toca trabajar', libre:'Día libre', vac:'Vacaciones', perm:'Permiso',
    extra:'Asistió sin que le tocara', sinh:'Asistió (sin horario cargado ese día)', otro:'Otro', nada:'Sin horario'};

  function codigoDeEst(f, d){
    const e = f.est[d];
    if(e === 'ok' || e === 'sinh') return 'A';
    if(e === 'falta') return 'F';
    if(e === 'justif') return 'J';
    if(e === 'libre') return 'L';
    if(e === 'vac') return 'V';
    if(e === 'perm') return 'P';
    if(e === 'extra') return 'E';
    if(e === 'otro') return String(f.days[d]).slice(0,2);
    return '';
  }

  // Abre la ventana para justificar una falta, registrar un permiso o vacaciones, o autorizar a trabajar un día no programado.
  async function editarNovedadDia(f, d, nov){
    const cierre = await mesCerradoFecha(d);
    if(cierre){ avisoMesCerrado(cierre, d); return; }
    const est = f.est[d];
    const porDefecto = nov ? nov.codigo : ({falta:'J', hoy:'J', prog:'P', ok:'A', extra:'A', libre:'A', vac:'A', perm:'A', nada:'P', otro:'P', sinh:'A', justif:'J'}[est] || 'J');
    const res = await abrirModalNovedad({
      titulo: f.nombre, avatarNombre: f.nombre,
      subtitulo: formatDateEs(d)+' · '+(NOM_EST[est] || ''),
      tipos: NOV_TIPOS, tipo: porDefecto, motivo: nov ? nov.motivo : '', autoriza: nov ? nov.autoriza : '',
      motivoLabel: 'Motivo', autorizaLabel: 'Autorizado por', sugerencias: nombresAutorizadores(), permitirQuitar: !!nov,
      textoGuardar: nov ? 'Guardar cambios' : 'Guardar novedad',
      nota: nov ? ('Registrada por '+nov.por+' el '+fechaHoraCorta(nov.en)+'.') : 'Queda registrado quién la hizo y cuándo.'
    });
    if(!res) return;
    try{
      if(res.accion === 'quitar'){ await quitarNovedad(f.staffId, f.nombre, d); showToast('Novedad quitada.'); }
      else { await guardarNovedad({staffId:f.staffId, nombre:f.nombre, fecha:d, codigo:res.tipo, motivo:res.motivo, autoriza:res.autoriza}); showToast('Novedad guardada.'); }
    }catch(e){ showToast('No se pudo guardar. Revisa tu internet.'); }
    render();
  }

  function renderComparativa(wrap, c){
    const start = c.start, end = c.end, dates = c.dates, today = c.today, mode = c.mode;
    const meses = Array.from(new Set([start.slice(0,7), end.slice(0,7)]));
    const kNov = start+'_'+end;
    const ymCierre = (mode === 'mes') ? start.slice(0,7) : null;
    let fallo = false, cargando = false;
    meses.forEach(ym=>{
      if(state.horarioCache[ym] !== undefined) return;
      if(state.horarioFailed[ym]) fallo = true;
      else { cargando = true; setTimeout(()=> loadHorarioMes(ym), 0); }
    });
    if(!state.novedadesCache[kNov]){
      if(state.novedadesFailed[kNov]) fallo = true;
      else { cargando = true; setTimeout(()=> cargarNovedadesRango(start, end), 0); }
    }
    if(ymCierre && state.cierreCache[ymCierre] === undefined){
      cargando = true; setTimeout(()=>{ cierreDe(ymCierre).then(()=> render()); }, 0);
    }
    if(fallo || cargando){
      const st = document.createElement('div');
      st.className = 'card empty';
      if(fallo){
        st.innerHTML = '<div class="ic-big">'+icon('refresh',24)+'</div>No se pudo cargar el horario.';
        const retry = document.createElement('button');
        retry.className = 'action secundario'; retry.style.marginTop = '14px'; retry.textContent = 'Reintentar';
        retry.onclick = ()=>{ state.horarioFailed = {}; state.novedadesFailed = {}; render(); };
        st.appendChild(retry);
      } else st.innerHTML = '<div class="spinner"></div>Cargando el horario…';
      wrap.appendChild(st);
      return;
    }

    const porStaff = {}; let orden = 0, linea = '';
    meses.forEach(ym=>{
      const h = state.horarioCache[ym];
      if(!h || !h.rows) return;
      if(h.linea && !linea) linea = h.linea;
      h.rows.forEach(r=>{
        let o = porStaff[r.staffId];
        if(!o) o = porStaff[r.staffId] = {staffId:r.staffId, name:r.name, cargo:r.cargo || '', linea:r.linea || '', days:{}, orden:orden++};
        Object.assign(o.days, r.days);
      });
    });
    let filas = Object.keys(porStaff).map(k=> porStaff[k]);
    if(!filas.length){
      const e = document.createElement('div');
      e.className = 'card empty';
      e.innerHTML = '<div class="ic-big">'+icon('calendar',24)+'</div>Todavía no hay un horario cargado para este periodo.'+
        (state.session.role === 'admin' ? '<br><span style="font-size:12.5px;">Cárgalo en Configuración → Horario de trabajo.</span>' : '');
      wrap.appendChild(e);
      return;
    }

    const nmap = state.novedadesCache[kNov].map;
    const cierre = ymCierre ? state.cierreCache[ymCierre] : null;
    const nb = state.nominaBase || {};
    const pun = nb.entradaNormal ? {entrada: nb.entradaNormal, tolerancia: Number(nb.tolerancia) || 0} : null;
    const asist = {};
    c.allRows.forEach(r=>{ asist[r.id] = r.cells; });
    filas.forEach(f=>{
      const p = state.staff.find(x=> x.id === f.staffId);
      f.nombre = p ? p.name : f.name;
      f.area = p ? p.area : 'Sin área';
      f.est = {}; f.hubo = {}; f.prog = {}; f.nov = {}; f.tarde = {};
      f.ok = 0; f.falt = 0; f.just = 0; f.extra = 0; f.aut = 0; f.progTotal = 0; f.libres = 0; f.vac = 0; f.perm = 0; f.atrasos = 0; f.minAtraso = 0;
      dates.forEach(d=>{
        let prog = tipoProg(f.days[d]);
        const nov = nmap[f.staffId+'_'+d] || null;
        let justif = false, aut = false;
        if(nov){
          if(nov.codigo === 'A'){ prog = 'T'; aut = true; }
          else if(nov.codigo === 'J'){ justif = true; }
          else prog = nov.codigo;               // P, V o L registrados en la app
        }
        const cel = asist[f.staffId] && asist[f.staffId][d];
        const hubo = !!cel;
        let e;
        if(prog === 'T') e = hubo ? 'ok' : (justif ? 'justif' : (d < today ? 'falta' : (d === today ? 'hoy' : 'prog')));
        else if(hubo) e = (prog === '') ? 'sinh' : 'extra';
        else e = (prog === 'L') ? 'libre' : (prog === 'V' ? 'vac' : (prog === 'P' ? 'perm' : (prog === 'O' ? 'otro' : 'nada')));
        f.est[d] = e; f.hubo[d] = hubo; f.prog[d] = prog; f.nov[d] = nov;
        if(prog === 'T') f.progTotal++;
        if(prog === 'L') f.libres++;
        if(prog === 'V') f.vac++;
        if(prog === 'P') f.perm++;
        if(e === 'ok'){ f.ok++; if(aut) f.aut++; }
        if(e === 'falta') f.falt++;
        if(e === 'justif') f.just++;
        if(e === 'extra') f.extra++;
        if(pun && e === 'ok' && cel && cel.tarde > 0){ f.tarde[d] = cel.tarde; f.atrasos++; f.minAtraso += cel.tarde; }
      });
    });
    const todas = filas.slice().sort((a,b)=> a.orden - b.orden);
    const porId = {}; todas.forEach(f=>{ porId[f.staffId] = f; });
    if(state.nominaArea !== 'todas') filas = filas.filter(f=> f.area === state.nominaArea);
    filas.sort((a,b)=> a.area.localeCompare(b.area,'es') || a.orden - b.orden);

    if(!filas.length){
      const e = document.createElement('div');
      e.className = 'card empty';
      e.innerHTML = '<div class="ic-big">'+icon('inbox',24)+'</div>No hay personas con horario en esta área.';
      wrap.appendChild(e);
      return;
    }

    const suma = (k)=> filas.reduce((s,f)=> s + f[k], 0);
    const tOk = suma('ok'), tFalt = suma('falt'), tJust = suma('just'), tExtra = suma('extra'), tAtr = suma('atrasos'), tMinAtr = suma('minAtraso');
    const cumpl = (tOk + tFalt) ? Math.round(tOk * 100 / (tOk + tFalt)) : null;
    const idsMostrados = new Set(filas.map(f=> f.staffId));
    const tNov = Object.keys(nmap).filter(k=> idsMostrados.has(nmap[k].staffId)).length;

    // ---- cierre del mes ----
    if(mode === 'mes'){
      const cb = document.createElement('div');
      cb.className = 'card cierre-banner'+(cierre ? ' cerrado' : '');
      const esAdmin = state.session.role === 'admin';
      if(cierre){
        const integro = cierreIntegro(cierre);
        cb.innerHTML = '<div class="cb-head"><div class="cb-ic">'+icon('lock',20)+'</div><div><div class="cb-t">Mes cerrado</div>'+
          '<div class="cb-s">Cerrado por '+escapeHtml(cierre.cerradoPor || '')+' el '+escapeHtml(fechaHoraCorta(cierre.en))+'. Huella '+escapeHtml(cierre.huella || '')+
          (integro ? ' · <b>íntegra</b>' : ' · <b style="color:var(--danger);">ALTERADA: no coincide con el cierre</b>')+
          '. No se pueden editar marcaciones ni novedades de este mes.</div></div></div>';
        if(esAdmin){
          const br = document.createElement('button');
          br.className = 'action secundario'; br.style.marginTop = '10px'; br.textContent = 'Reabrir mes';
          br.onclick = async ()=>{
            const motivo = window.prompt('Motivo para reabrir '+nombreMes(ymCierre)+':');
            if(!motivo || motivo.trim().length < 3){ showToast('Reapertura cancelada: escribe el motivo.'); return; }
            try{ await reabrirMes(ymCierre, motivo.trim()); showToast('Mes reabierto.'); }catch(e){ showToast('No se pudo reabrir. Revisa tu internet.'); }
            render();
          };
          cb.appendChild(br);
        }
        wrap.appendChild(cb);
      } else if(esAdmin){
        const terminado = end < today;
        cb.innerHTML = '<div class="cb-head"><div class="cb-ic">'+icon('lock',20)+'</div><div><div class="cb-t">Cierre de mes</div>'+
          '<div class="cb-s">'+(terminado
            ? 'Al cerrar, el resumen de '+escapeHtml(nombreMes(ymCierre))+' queda guardado con su huella y ya no se pueden cambiar las marcaciones ni las novedades de ese mes. Revisa antes las faltas y las entradas sin salida.'
            : 'Podrás cerrar el mes cuando termine (después del '+escapeHtml(formatDateEs(end))+').')+'</div></div></div>';
        if(terminado){
          const bc = document.createElement('button');
          bc.className = 'action'; bc.style.marginTop = '10px'; bc.innerHTML = icon('lock',18)+'Cerrar '+escapeHtml(nombreMes(ymCierre));
          bc.onclick = async ()=>{
            if(!window.confirm('¿Cerrar '+nombreMes(ymCierre)+'?\n\nPersonas: '+todas.length+'\nCumplidos: '+todas.reduce((s,f)=>s+f.ok,0)+' · Faltas: '+todas.reduce((s,f)=>s+f.falt,0)+' · Justificadas: '+todas.reduce((s,f)=>s+f.just,0)+
              '\n\nDespués no se podrán editar marcaciones ni novedades de ese mes sin reabrirlo.')) return;
            bc.disabled = true; bc.textContent = 'Cerrando…';
            try{
              const cambios = await consultarAuditoriaRango(start, end);
              const modelo = construirModelo({start:start, end:end, dates:dates, today:today, filas:todas, allRows:c.allRows, days:c.days, linea:linea, nmap:nmap, pun:pun, cambios:cambios});
              await cerrarMes(ymCierre, modelo);
              showToast(nombreMes(ymCierre)+' cerrado.');
            }catch(e){ showToast('No se pudo cerrar el mes. Revisa tu internet.'); }
            render();
          };
          cb.appendChild(bc);
        }
        wrap.appendChild(cb);
      }
    }

    const stats = document.createElement('div');
    stats.className = 'nm-stats';
    stats.innerHTML =
      '<div class="nm-stat hl"><div class="num">'+(cumpl == null ? '–' : cumpl+'<small>%</small>')+'</div><div class="lbl">Cumplimiento del horario</div></div>'+
      '<div class="nm-stat"><div class="num" style="color:'+(tFalt ? 'var(--danger)' : 'inherit')+'">'+tFalt+'</div><div class="lbl">Faltas sin justificar</div></div>'+
      '<div class="nm-stat"><div class="num">'+tJust+'</div><div class="lbl">Faltas justificadas</div></div>'+
      '<div class="nm-stat"><div class="num">'+tOk+'</div><div class="lbl">Días cumplidos</div></div>'+
      '<div class="nm-stat"><div class="num">'+tExtra+'</div><div class="lbl">Asistió sin que le tocara</div></div>'+
      (pun ? '<div class="nm-stat"><div class="num">'+tAtr+'</div><div class="lbl">Atrasos'+(tMinAtr ? ' ('+tMinAtr+' min)' : '')+'</div></div>'
           : '<div class="nm-stat"><div class="num">'+tNov+'</div><div class="lbl">Novedades registradas</div></div>');
    wrap.appendChild(stats);

    const legend = document.createElement('div');
    legend.className = 'nm-legend';
    legend.style.margin = '0 2px 12px';
    legend.innerHTML =
      '<span><i style="background:var(--brand)"></i>Asistió</span>'+
      '<span><i style="background:#C9503E"></i>Falta</span>'+
      '<span><i style="background:#F6B26B"></i>Falta justificada</span>'+
      '<span><i style="background:#F2C66B"></i>Asistió sin que le tocara</span>'+
      '<span><i style="background:#EAF3EC;border:1px solid #BFD8C8"></i>Le toca</span>'+
      '<span><i style="background:#F0EEE6;border:1px solid var(--line)"></i>Libre</span>'+
      '<span><i style="background:#DD7E6B"></i>Vacaciones</span>'+
      '<span><i style="background:#3F6FA0"></i>Permiso</span>'+
      '<span><i style="background:#fff;border:2px solid #3B3B3B"></i>Con novedad registrada</span>'+
      (pun ? '<span><i style="background:#F28C28;border-radius:50%"></i>Llegó tarde</span>' : '');
    wrap.appendChild(legend);

    function celda(f, d){
      const e = f.est[d], nov = f.nov[d], tarde = f.tarde[d];
      let t = NOM_EST[e];
      if(e === 'extra') t = {L:'Asistió en su día libre', V:'Asistió estando de vacaciones', P:'Asistió con permiso'}[f.prog[d]] || 'Asistió en un día no programado';
      if(nov) t += ' · '+NOV_ETIQUETA[nov.codigo]+': '+nov.motivo+' (autoriza: '+nov.autoriza+')';
      if(tarde) t += ' · Llegó tarde: '+tarde+' min';
      const attrs = ' title="'+escapeHtml(formatDateEs(d)+': '+t)+'" data-f="'+escapeHtml(f.staffId)+'" data-d="'+d+'"';
      const extraCls = (nov ? ' k-nov' : '')+(tarde ? ' k-tarde' : '');
      if(e === 'ok') return '<td class="c k k-ok'+extraCls+'"'+attrs+'>'+icon('check',16)+'</td>';
      if(e === 'falta') return '<td class="c k k-falta'+extraCls+'"'+attrs+'>'+icon('x',16)+'</td>';
      if(e === 'justif') return '<td class="c k k-just'+extraCls+'"'+attrs+'>J</td>';
      if(e === 'extra') return '<td class="c k k-extra'+extraCls+'"'+attrs+'>'+icon('plus',16)+'</td>';
      if(e === 'sinh') return '<td class="c k k-sinh'+extraCls+'"'+attrs+'>'+icon('check',16)+'</td>';
      if(e === 'hoy') return '<td class="c k k-hoy'+extraCls+'"'+attrs+'>…</td>';
      if(e === 'prog') return '<td class="c k k-prog'+extraCls+'"'+attrs+'>•</td>';
      if(e === 'libre') return '<td class="c k k-libre'+extraCls+'"'+attrs+'>L</td>';
      if(e === 'vac') return '<td class="c k k-vac'+extraCls+'"'+attrs+'>V</td>';
      if(e === 'perm') return '<td class="c k k-perm'+extraCls+'"'+attrs+'>P</td>';
      if(e === 'otro') return '<td class="c k k-otro'+extraCls+'"'+attrs+'>'+escapeHtml(String(f.days[d]))+'</td>';
      return '<td class="c k'+extraCls+'"'+attrs+'></td>';
    }
    const headCols = dates.map(d=>{
      const dt = parseDate(d), i = (dt.getDay() + 6) % 7, wk = (i >= 5) ? ' wk' : '';
      return mode === 'semana'
        ? '<th class="c'+wk+'">'+DOW_PDF[i]+'<small>'+d.slice(8)+'/'+d.slice(5,7)+'</small></th>'
        : '<th class="c'+wk+'">'+DOW_LETTER_MON[i]+'<small>'+Number(d.slice(8))+'</small></th>';
    }).join('');

    const byArea = {};
    filas.forEach(f=>{ (byArea[f.area] = byArea[f.area] || []).push(f); });
    const areaOrder = Object.keys(byArea).sort((a,b)=> a.localeCompare(b,'es'));
    const nSum = pun ? 3 : 2;
    let body = '';
    areaOrder.forEach(area=>{
      body += '<tr class="nm-area"><td class="nm-name">'+escapeHtml(area)+'</td><td colspan="'+(dates.length + nSum)+'">'+byArea[area].filter(f=>f.falt).length+' con faltas</td></tr>';
      byArea[area].forEach(f=>{
        body += '<tr><td class="nm-name">'+escapeHtml(f.nombre)+(f.cargo ? '<small class="cg">'+escapeHtml(f.cargo)+'</small>' : '')+'</td>'+
          dates.map(d=> celda(f, d)).join('')+
          '<td class="nm-sum">'+f.ok+'</td><td class="nm-sum'+(f.falt ? ' bad' : '')+'">'+f.falt+'</td>'+(pun ? '<td class="nm-sum'+(f.atrasos ? ' bad' : '')+'">'+f.atrasos+'</td>' : '')+'</tr>';
      });
    });
    const progDia = {}, asisDia = {};
    dates.forEach(d=>{
      progDia[d] = filas.filter(f=> f.prog[d] === 'T').length;
      asisDia[d] = filas.filter(f=> f.hubo[d]).length;
    });
    const foot =
      '<tr><td class="nm-name">Programados</td>'+dates.map(d=>'<td class="c">'+progDia[d]+'</td>').join('')+'<td class="nm-sum"></td><td class="nm-sum"></td>'+(pun ? '<td class="nm-sum"></td>' : '')+'</tr>'+
      '<tr><td class="nm-name">Asistieron</td>'+dates.map(d=>'<td class="c">'+(d > today ? '' : asisDia[d])+'</td>').join('')+'<td class="nm-sum">'+tOk+'</td><td class="nm-sum">'+tFalt+'</td>'+(pun ? '<td class="nm-sum">'+tAtr+'</td>' : '')+'</tr>';

    const tableCard = document.createElement('div');
    tableCard.className = 'card nm-card';
    tableCard.innerHTML =
      '<div class="nm-grid-wrap"><table class="nm-grid '+(mode === 'semana' ? 'sem' : 'mes')+'">'+
      '<thead><tr><th class="nm-name">Nombres</th>'+headCols+'<th class="nm-sum">Asist.</th><th class="nm-sum">Faltas</th>'+(pun ? '<th class="nm-sum">Atras.</th>' : '')+'</tr></thead>'+
      '<tbody>'+body+'</tbody><tfoot>'+foot+'</tfoot></table></div>';
    wrap.appendChild(tableCard);
    // tocar un día abre la ventana de novedades (justificar, permiso, vacaciones, autorizar a trabajar)
    tableCard.querySelectorAll('td.k[data-f]').forEach(td=>{
      td.style.cursor = 'pointer';
      td.onclick = ()=>{
        const f = porId[td.dataset.f], d = td.dataset.d;
        if(f) editarNovedadDia(f, d, nmap[f.staffId+'_'+d] || null);
      };
    });
    const pista = document.createElement('div');
    pista.className = 'nm-pista';
    pista.textContent = cierre ? 'Mes cerrado: solo se puede consultar y descargar.' : 'Toca un día para justificar una falta, registrar un permiso o vacaciones, o autorizar que trabaje un día libre.';
    wrap.appendChild(pista);

    // ---- exportar ----
    const txt = {ok:'Asistió', falta:'Falta', justif:'Falta justificada', hoy:'Pendiente hoy', prog:'Le toca', libre:'Libre', vac:'Vacaciones', perm:'Permiso', extra:'Asistió sin que le tocara', sinh:'Asistió', otro:'Otro', nada:''};
    const letra = {ok:'A', falta:'F', justif:'J', hoy:'…', prog:'·', libre:'L', vac:'V', perm:'P', extra:'E', sinh:'A', otro:'?', nada:''};
    const actions = document.createElement('div');
    actions.className = 'card row wrap';
    if(mode === 'mes'){
      const btnXls = document.createElement('button');
      btnXls.className = 'action';
      btnXls.innerHTML = icon('download',18)+'Descargar hoja de asistencia (Excel)';
      btnXls.onclick = async ()=>{
        btnXls.disabled = true; btnXls.textContent = 'Preparando el archivo…';
        try{
          let modelo, metaCierre = null;
          if(cierre && cierre.modelo){ modelo = cierre.modelo; metaCierre = cierre; }
          else {
            const cambios = await consultarAuditoriaRango(start, end);
            modelo = construirModelo({start:start, end:end, dates:dates, today:today, filas:todas, allRows:c.allRows, days:c.days, linea:linea, nmap:nmap, pun:pun, cambios:cambios});
          }
          await descargarHojaAsistenciaExcel(modelo, metaCierre);
        }catch(e){ showToast(e && e.message ? e.message : 'No se pudo generar el archivo.'); }
        render();
      };
      actions.appendChild(btnXls);
    }
    const btnCsv = document.createElement('button');
    btnCsv.className = mode === 'mes' ? 'action secundario' : 'action';
    btnCsv.innerHTML = icon('download',18)+'Descargar CSV';
    btnCsv.onclick = ()=>{
      const head = ['Nombre','Cargo','Área'].concat(dates.map(d=> d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4))).concat(['Asistió','Faltas','Faltas justificadas','Asistió sin que le tocara','Atrasos','Cumplimiento %']);
      let csv = head.map(csvEscape).join(',')+'\n';
      filas.forEach(f=>{
        const cu = (f.ok + f.falt) ? Math.round(f.ok * 100 / (f.ok + f.falt)) : '';
        csv += [f.nombre, f.cargo, f.area].concat(dates.map(d=> txt[f.est[d]])).concat([f.ok, f.falt, f.just, f.extra, pun ? f.atrasos : '', cu]).map(csvEscape).join(',')+'\n';
      });
      downloadFile('comparativa_horario_'+(mode==='semana' ? 'semana_' : 'mes_')+start+'.csv', '\ufeff'+csv, 'text/csv;charset=utf-8');
    };
    const btnPdf = document.createElement('button');
    btnPdf.className = 'action secundario';
    btnPdf.innerHTML = icon('file',18)+'Generar PDF';
    btnPdf.onclick = ()=>{
      const dl = (d)=>{ const i = (parseDate(d).getDay() + 6) % 7; return mode === 'semana' ? DOW_PDF[i]+' '+d.slice(8)+'/'+d.slice(5,7) : String(Number(d.slice(8))); };
      const headers = ['Nombres'].concat(dates.map(dl)).concat(['Asist.','Faltas']);
      const sections = areaOrder.map(area=>({
        heading: area, headers: headers,
        rows: byArea[area].map(f=> [f.nombre].concat(dates.map(d=> letra[f.est[d]])).concat([String(f.ok), String(f.falt)]))
      }));
      sections.push({heading:'', headers: headers, rows: [
        ['Programados'].concat(dates.map(d=> String(progDia[d]))).concat(['','']),
        ['Asistieron'].concat(dates.map(d=> d > today ? '' : String(asisDia[d]))).concat([String(tOk), String(tFalt)])
      ]});
      const sub = c.label + (state.nominaArea !== 'todas' ? ' · '+state.nominaArea : '')+'  —  A = asistió · F = falta · J = falta justificada · L = libre · V = vacaciones · P = permiso · E = asistió sin que le tocara · · = le toca';
      const colStyles = {0:{cellWidth: mode === 'mes' ? 34 : 38, halign:'left'}};
      for(let i = 1; i < headers.length; i++) colStyles[i] = {halign:'center'};
      generarPdf('comparativa_horario_'+(mode==='semana' ? 'semana_' : 'mes_')+start+'.pdf', 'Comparativa · Horario y asistencia', sub, sections,
        mode === 'mes' ? {orientation:'landscape', fontSize:6.5, cellPadding:1.4, columnStyles:colStyles}
                       : {fontSize:8.5, cellPadding:2.2, columnStyles:colStyles});
    };
    actions.appendChild(btnCsv); actions.appendChild(btnPdf);
    if(mode !== 'mes'){
      const pi = document.createElement('div');

      pi.textContent = 'La hoja de asistencia completa con el resumen del mes se descarga desde la vista Mes.';
      actions.appendChild(pi);

    const note = document.createElement('div');

    note.innerHTML = '<p class="nm-note"><b>Cómo se compara:</b> un día cuenta como <b>asistió</b> si el guardia registró la entrada de esa persona ese día. Si le tocaba trabajar (código A) y no hay registro, es una <b>falta</b>; si tiene una novedad de <b>falta justificada</b>, deja de contar como falta sin justificar. Los días de hoy y los que vienen no cuentan hasta que pasen. Si no le tocaba —libre, vacaciones o permiso— y vino, aparece como <b>asistió sin que le tocara</b> hasta que alguien lo autorice (en la garita se pide la autorización al registrar la entrada). Los días de vacaciones (V) y permiso (P) no son faltas. El cumplimiento es días cumplidos ÷ (cumplidos + faltas sin justificar).'+
      (pun ? ' Un <b>atraso</b> es llegar después de las '+horaBonita(pun.entrada)+' más '+pun.tolerancia+' min de tolerancia.' : '')+'</p>';
    wrap.appendChild(note);

  // ---- Modelo del mes: lo que se descarga en Excel y lo que queda guardado al cerrar ----
  function construirModelo(c){
    const ym = c.start.slice(0,7), Y = +ym.slice(0,4), M = +ym.slice(5,7);
    const today = c.today;
    const sinSalida = {}, sinSalidaLista = [];
    Object.keys(c.days).sort().forEach(d=>{
      if(d >= today || d < c.start || d > c.end) return;
      (c.days[d] || []).forEach(rec=>{
        const p = state.staff.find(x=> x.id === rec.staffId);
        if(p && p.resident) return;
        if(rec.salida) return;
        sinSalida[rec.staffId] = (sinSalida[rec.staffId] || 0) + 1;
        sinSalidaLista.push({d:d, rec:rec});
      });
    });
    const enCrono = {};
    c.filas.forEach(f=>{ enCrono[f.staffId] = true; });
    const asist = {};
    c.allRows.forEach(r=>{ asist[r.id] = r.cells; });

    const filas = c.filas.map(f=>{
      const h = c.allRows.find(x=> x.id === f.staffId) || {totalMins:0, extraMins:0, noc:0};
      const codes = {}, progMap = {};
      c.dates.forEach(d=>{ codes[d] = codigoDeEst(f, d); progMap[d] = f.prog[d] || ''; });
      return {staffId:f.staffId, nombre:f.nombre, cargo:f.cargo || '', linea:f.linea || '', area:f.area, orden:f.orden, codes:codes, progMap:progMap,
        progTotal:f.progTotal, ok:f.ok, falt:f.falt, just:f.just, libres:f.libres, vac:f.vac, perm:f.perm, extra:f.extra, aut:f.aut,
        atrasos:f.atrasos, minAtraso:f.minAtraso, sinSalida:(sinSalida[f.staffId] || 0), totalMins:h.totalMins, extraMins:h.extraMins, noc:h.noc};
    });

    const novedades = [];
    c.filas.forEach(f=>{
      c.dates.forEach(d=>{
        const e = f.est[d], nov = f.nov[d];
        const base = {d:d, nombre:f.nombre, cargo:f.cargo || '', justificacion:'', autoriza:''};
        if(e === 'falta') novedades.push(Object.assign({}, base, {tipo:'FALTA', detalle:'Le tocaba trabajar y no hay entrada registrada ni justificación.'}));
        else if(e === 'justif') novedades.push(Object.assign({}, base, {tipo:'FALTA JUSTIFICADA', detalle:'Le tocaba trabajar y no asistió.', justificacion:nov.motivo, autoriza:nov.autoriza}));
        else if(e === 'extra') novedades.push(Object.assign({}, base, {tipo:{L:'ASISTIÓ EN DÍA LIBRE', V:'ASISTIÓ EN VACACIONES', P:'ASISTIÓ CON PERMISO'}[f.prog[d]] || 'ASISTIÓ SIN PROGRAMACIÓN',
          detalle:'Asistió en un día en que no le tocaba trabajar: requiere autorización.', justificacion:nov ? nov.motivo : '', autoriza:nov ? nov.autoriza : ''}));
        else if(e === 'sinh') novedades.push(Object.assign({}, base, {tipo:'ASISTIÓ SIN HORARIO CARGADO', detalle:'Hay entrada registrada, pero el cronograma no tiene código para ese día.'}));
        else if(e === 'ok' && nov && nov.codigo === 'A') novedades.push(Object.assign({}, base, {tipo:'AUTORIZADO A TRABAJAR', detalle:'Trabajó un día que no le tocaba, con autorización.', justificacion:nov.motivo, autoriza:nov.autoriza}));
        else if(nov && (nov.codigo === 'P' || nov.codigo === 'V' || nov.codigo === 'L') && !f.hubo[d]) novedades.push(Object.assign({}, base, {tipo:(NOV_ETIQUETA[nov.codigo]+' (registrado en la app)').toUpperCase(), detalle:'Cambio hecho en la app sobre el cronograma.', justificacion:nov.motivo, autoriza:nov.autoriza}));
        if(f.tarde[d]){
          const cel = asist[f.staffId] && asist[f.staffId][d];
          novedades.push(Object.assign({}, base, {tipo:'ATRASO', detalle:'Entró a las '+(cel && cel.entrada ? cel.entrada : '')+', '+f.tarde[d]+' min después de las '+(c.pun ? c.pun.entrada : '')+'.'}));
        }
      });
    });
    sinSalidaLista.forEach(x=>{
      const p = state.staff.find(s=> s.id === x.rec.staffId);
      novedades.push({d:x.d, tipo:'ENTRADA SIN SALIDA', nombre:x.rec.name || (p && p.name) || '', cargo:'', detalle:'Entró a las '+x.rec.entrada+' y no tiene salida registrada: sus horas no se pueden calcular.', justificacion:'', autoriza:''});
    });
    novedades.sort((a,b)=> a.d.localeCompare(b.d) || a.nombre.localeCompare(b.nombre,'es'));

    const marcaciones = [];
    Object.keys(c.days).sort().forEach(d=>{
      if(d < c.start || d > c.end) return;
      (c.days[d] || []).slice().sort((a,b)=> (a.name || '').localeCompare(b.name || '','es') || (a.entrada || '').localeCompare(b.entrada || '')).forEach(rec=>{
        const mins = calcMinutos(rec.entrada, rec.salida);
        const cel = asist[rec.staffId] && asist[rec.staffId][d];
        const tarde = (cel && cel.entrada === rec.entrada && cel.tarde > 0) ? cel.tarde : 0;
        marcaciones.push({d:d, name:rec.name || '', area:rec.area || '', entrada:rec.entrada || '', salida:rec.salida || '', sinSalida:(!rec.salida && !rec.salidaFecha),
          mins:(mins == null ? null : mins), entradaPor:rec.entradaPor || '', salidaPor:rec.salidaPor || '', enCrono:!!enCrono[rec.staffId], tarde:tarde});
      });
    });

    return {ym:ym, mes:MESES_ES[M - 1].toUpperCase(), anio:Y, linea:(c.linea || 'PORCICOLA').toUpperCase(),
      inicio:c.start, fin:c.end, corte:(c.end < today ? c.end : today), mesEnCurso:(c.end >= today), dates:c.dates,
      puntualidad:(c.pun || null), filas:filas, novedades:novedades, marcaciones:marcaciones,
      cambios:(c.cambios || []).map(x=>({en:x.en || '', por:x.por || '', accion:x.accion || '', detalle:x.detalle || ''}))};
  }

  // ---- Descarga: hoja de asistencia del mes (Excel) con resumen, novedades, marcaciones y cambios ----
  async function descargarHojaAsistenciaExcel(m, cierre){
    await loadExcelJs();
    const dates = m.dates, nd = dates.length;
    const MES = m.mes, Y = m.anio, filas = m.filas, pun = m.puntualidad;
    const generado = new Date().toLocaleString('es-EC',{dateStyle:'short', timeStyle:'short'});
    const usuario = (state.session && (state.session.nombre || ROLE_LABELS[state.session.role])) || '';
    const lineaNeg = m.linea;
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Portería'; wb.created = new Date();
    wb.calcProperties = {fullCalcOnLoad: true};
    const thin = {style:'thin', color:{argb:'FF9E9E9E'}};
    const BORDE = {top:thin, left:thin, bottom:thin, right:thin};
    function pon(ws, r, col, val, o){
      o = o || {};
      const cell = ws.getCell(r, col);
      if(val !== undefined) cell.value = val;
      cell.font = {name:'Arial', size:o.size || 10, bold:!!o.bold, italic:!!o.italic, color:{argb:o.color || 'FF000000'}};
      if(o.fill) cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:o.fill}};
      cell.alignment = {horizontal:o.h || 'center', vertical:'middle', wrapText:o.wrap !== false};
      if(o.border !== false) cell.border = BORDE;
      if(o.fmt) cell.numFmt = o.fmt;
      return cell;
    }
    const COLORES = Object.assign({J:'FFF9CB9C'}, COLOR_COD);
    const colorTexto = (cod)=> (cod === 'P' || cod === 'F') ? 'FFFFFFFF' : 'FF000000';
    const horaTxt = (mins)=> mins ? Math.floor(mins / 60)+':'+p2(mins % 60) : '';
    const dec = (mins)=> Math.round(mins / 60 * 100) / 100;
    const estadoTxt = cierre
      ? 'MES CERRADO el '+fechaHoraCorta(cierre.en)+' por '+(cierre.cerradoPor || '')+' · Huella '+cierre.huella+(cierreIntegro(cierre) ? ' (íntegra)' : ' (ALTERADA)')
      : (m.mesEnCurso ? 'Mes en curso (sin cerrar)' : 'Mes sin cerrar');

    // ===== Hoja 1: ASISTENCIA =====
    const ws = wb.addWorksheet('ASISTENCIA '+MES.slice(0,3)+' '+Y, {
      views:[{state:'frozen', xSplit:4, ySplit:5}],
      pageSetup:{orientation:'landscape', paperSize:9, fitToPage:true, fitToWidth:1, fitToHeight:0, horizontalCentered:true}
    });
    const cD0 = 5, cDN = 4 + nd;
    const sumCols = ['DIAS JORNADA','ASISTIÓ','FALTAS','JUSTIF.','LIBRES','VACAC','PERMISO','EXTRA','TOTAL','% CUMPL.'].concat(pun ? ['ATRASOS'] : []);
    const cS0 = cDN + 1, cObs = cS0 + sumCols.length, cLast = cObs;
    ws.getColumn(1).width = 4.5; ws.getColumn(2).width = 34; ws.getColumn(3).width = 16; ws.getColumn(4).width = 22;
    for(let i = cD0; i <= cDN; i++) ws.getColumn(i).width = 4.6;
    for(let i = cS0; i < cObs; i++) ws.getColumn(i).width = 9.5;
    ws.getColumn(cObs).width = 34;
    [28, 20, 20, 24, 30].forEach((h, i)=>{ ws.getRow(i + 1).height = h; });
    ws.mergeCells(1, 1, 2, 4);
    pon(ws, 1, 1, MES+' - '+Y, {size:20, bold:true, border:false});
    ws.mergeCells(1, cD0, 1, cLast);
    pon(ws, 1, cD0, 'HOJA DE ASISTENCIA · PROGRAMADO VS REAL', {size:16, bold:true, fill: cierre ? 'FFFFE599' : 'FFD9EAD3', border:false});
    ws.mergeCells(2, cD0, 2, cLast);
    pon(ws, 2, cD0, lineaNeg+'  ·  Corte: '+formatDateEs(m.corte)+'  ·  '+estadoTxt+'  ·  Generado: '+generado+(usuario ? ' por '+usuario : ''), {size:9, italic:true, border:false});
    ws.mergeCells(3, 1, 3, 4);
    pon(ws, 3, 1, 'LÍNEA DE NEGOCIO: '+lineaNeg, {size:9, bold:true, border:false});
    [['V','VACACIONES'],['L','LIBRE'],['A','ASISTIÓ'],['P','PERMISO'],['F','FALTA'],['J','JUSTIFICADA'],['E','EXTRA *']].forEach((it, i)=>{
      const c0 = cD0 + i * 4;
      if(c0 + 3 > cLast) return;
      ws.mergeCells(3, c0, 3, c0 + 3);
      pon(ws, 3, c0, it[0]+' '+it[1], {size:7, bold:true, fill:COLORES[it[0]], color:colorTexto(it[0])});
    });
    ws.mergeCells(4, 1, 4, 4);
    pon(ws, 4, 1, 'REGISTRO DE ASISTENCIA DEL PERSONAL', {size:9, bold:true, fill:'FFC9DAF8'});
    pon(ws, 5, 1, 'N°', {size:10, bold:true, fill:'FFE0F7FA'});
    pon(ws, 5, 2, 'NOMBRE', {size:12, bold:true, fill:'FFE0F7FA'});
    pon(ws, 5, 3, 'LINEA DE NEGOCIO', {size:9, bold:true, fill:'FFE0F7FA'});
    pon(ws, 5, 4, 'CARGO', {size:12, bold:true, fill:'FFE0F7FA'});
    dates.forEach((d, i)=>{
      pon(ws, 4, cD0 + i, DIA_CLAVES[parseDate(d).getDay()].toUpperCase(), {size:7, bold:true, fill:'FFC9DAF8'});
      pon(ws, 5, cD0 + i, Number(d.slice(8)), {size:8, bold:true, fill:'FFC9DAF8'});
    });
    sumCols.forEach((t, i)=>{
      ws.mergeCells(4, cS0 + i, 5, cS0 + i);
      pon(ws, 4, cS0 + i, t, {size:8, bold:true, fill: i === 0 ? 'FFFFF2CC' : (t === 'FALTAS' ? 'FFF4CCCC' : (t === 'JUSTIF.' ? 'FFF9CB9C' : 'FFC9DAF8'))});
    });
    ws.mergeCells(4, cObs, 5, cObs);
    pon(ws, 4, cObs, 'OBSERVACIONES', {size:9, bold:true, fill:'FFD9EAD3'});

    const L0 = colLetra(cD0), LN = colLetra(cDN);
    filas.forEach((f, i)=>{
      const r = 6 + i;
      pon(ws, r, 1, i + 1, {size:9});
      pon(ws, r, 2, f.nombre, {size:11, h:'left'});
      pon(ws, r, 3, f.linea || lineaNeg, {size:8});
      pon(ws, r, 4, f.cargo, {size:9});
      const cnt = {A:0, F:0, J:0, L:0, V:0, P:0, E:0}; let llenos = 0;
      dates.forEach((d, k)=>{
        const cod = f.codes[d] || '';
        if(cnt[cod] != null) cnt[cod]++;
        if(cod) llenos++;
        pon(ws, r, cD0 + k, cod || null, {size:8, bold:true, fill: COLORES[cod], color: colorTexto(cod)});
      });
      const rng = L0+r+':'+LN+r;
      const fx = (cod, res)=> ({formula:'COUNTIF('+rng+',"'+cod+'")', result:res});
      pon(ws, r, cS0, f.progTotal, {size:10, fill:'FFFFF2CC'});
      pon(ws, r, cS0 + 1, fx('A', cnt.A), {size:10, bold:true});
      pon(ws, r, cS0 + 2, fx('F', cnt.F), {size:10, bold:true, color: cnt.F ? 'FFC00000' : 'FF000000'});
      pon(ws, r, cS0 + 3, fx('J', cnt.J), {size:10});
      pon(ws, r, cS0 + 4, fx('L', cnt.L), {size:10});
      pon(ws, r, cS0 + 5, fx('V', cnt.V), {size:10});
      pon(ws, r, cS0 + 6, fx('P', cnt.P), {size:10});
      pon(ws, r, cS0 + 7, fx('E', cnt.E), {size:10});
      pon(ws, r, cS0 + 8, {formula:'COUNTA('+rng+')', result:llenos}, {size:10, bold:true});
      const colA = colLetra(cS0 + 1), colF = colLetra(cS0 + 2);
      pon(ws, r, cS0 + 9, {formula:'IF('+colA+r+'+'+colF+r+'=0,"",'+colA+r+'/('+colA+r+'+'+colF+r+'))', result:(cnt.A + cnt.F) ? cnt.A / (cnt.A + cnt.F) : ''}, {size:10, bold:true, fmt:'0%'});
      if(pun) pon(ws, r, cS0 + 10, f.atrasos, {size:10, color: f.atrasos ? 'FFC00000' : 'FF000000'});
      pon(ws, r, cObs, null, {size:9, h:'left'});
    });
    const rF = 6 + filas.length;
    [['PROGRAMADOS', 'FFFFF2CC'], ['ASISTIERON (A + E)', 'FFD9EAD3'], ['FALTAS (sin justificar)', 'FFF4CCCC']].forEach((t, i)=>{
      ws.mergeCells(rF + i, 1, rF + i, 4);
      pon(ws, rF + i, 1, t[0], {size:9, bold:true, fill:t[1], h:'right'});
    });
    dates.forEach((d, k)=>{
      const colL = colLetra(cD0 + k), rg = colL+'6:'+colL+(5 + filas.length);
      const prog = filas.filter(f=> f.progMap[d] === 'T').length;
      const asis = filas.filter(f=> f.codes[d] === 'A' || f.codes[d] === 'E').length;
      const falt = filas.filter(f=> f.codes[d] === 'F').length;
      pon(ws, rF, cD0 + k, prog, {size:8, bold:true, fill:'FFFFF2CC'});
      pon(ws, rF + 1, cD0 + k, {formula:'COUNTIF('+rg+',"A")+COUNTIF('+rg+',"E")', result:asis}, {size:8, bold:true, fill:'FFD9EAD3'});
      pon(ws, rF + 2, cD0 + k, {formula:'COUNTIF('+rg+',"F")', result:falt}, {size:8, bold:true, fill:'FFF4CCCC'});
    });
    const claves = ['progTotal','ok','falt','just','libres','vac','perm','extra'];
    claves.forEach((k, i)=>{
      const colL = colLetra(cS0 + i), rg = colL+'6:'+colL+(5 + filas.length);
      pon(ws, rF, cS0 + i, {formula:'SUM('+rg+')', result:filas.reduce((s, f)=> s + (f[k] || 0), 0)}, {size:9, bold:true, fill:'FFC9DAF8'});
    });
    if(pun){
      const colL = colLetra(cS0 + 10), rg = colL+'6:'+colL+(5 + filas.length);
      pon(ws, rF, cS0 + 10, {formula:'SUM('+rg+')', result:filas.reduce((s, f)=> s + (f.atrasos || 0), 0)}, {size:9, bold:true, fill:'FFC9DAF8'});
    }
    let rN = rF + 4;
    ws.mergeCells(rN, 1, rN, cLast);
    pon(ws, rN, 1, '* E = asistió en un día no programado (libre, vacaciones o permiso) sin autorización registrada.   F = le tocaba trabajar y no hay entrada registrada.   J = falta justificada (motivo y autorización en la hoja NOVEDADES).   Las vacaciones (V) y los permisos (P) no se cuentan como faltas.', {size:8, italic:true, h:'left', border:false});
    rN++;
    ws.mergeCells(rN, 1, rN, cLast);
    pon(ws, rN, 1, 'Hoja generada a partir de las entradas y salidas registradas en Portería y del cronograma cargado. Los totales por persona y por día son fórmulas: si se corrige un código, se recalculan.', {size:8, italic:true, h:'left', border:false});
    rN += 3;
    [['ELABORADO POR', 2, 3], ['REVISADO POR (JEFATURA)', cD0, cD0 + 9], ['APROBADO POR (RR. HH.)', cD0 + 11, cD0 + 20]].forEach(b=>{
      ws.mergeCells(rN, b[1], rN, b[2]);
      for(let k = b[1]; k <= b[2]; k++) ws.getCell(rN, k).border = {bottom:{style:'thin', color:{argb:'FF000000'}}};
      ws.mergeCells(rN + 1, b[1], rN + 1, b[2]);
      pon(ws, rN + 1, b[1], b[0], {size:8, bold:true, border:false});
    });
    ws.pageSetup.printArea = 'A1:'+colLetra(cLast)+(rN + 1);

    // ===== Hoja 2: RESUMEN MENSUAL =====
    const wr = wb.addWorksheet('RESUMEN MENSUAL', {views:[{state:'frozen', ySplit:7}], pageSetup:{orientation:'landscape', paperSize:9, fitToPage:true, fitToWidth:1, fitToHeight:0}});
    const heads = ['N°','NOMBRE','LINEA DE NEGOCIO','CARGO','DÍAS DE JORNADA PROGRAMADOS','DÍAS ASISTIDOS','FALTAS SIN JUSTIFICAR','FALTAS JUSTIFICADAS','% CUMPLIMIENTO','LIBRES','VACACIONES','PERMISOS','ASISTIÓ SIN QUE LE TOCARA','ENTRADAS SIN SALIDA']
      .concat(pun ? ['ATRASOS','MIN. DE ATRASO'] : []).concat(['HORAS TRABAJADAS','HORAS EXTRA (h:mm)','HORAS EXTRA (decimal)','HORAS NOCTURNAS 25%','OBSERVACIONES']);
    const anchos = [4.5, 32, 16, 22, 13, 11, 11, 11, 13, 9, 11, 10, 14, 12].concat(pun ? [10, 11] : []).concat([12, 12, 12, 13, 36]);
    anchos.forEach((w, i)=>{ wr.getColumn(i + 1).width = w; });
    wr.mergeCells(1, 1, 1, heads.length);
    pon(wr, 1, 1, 'RESUMEN MENSUAL DE ASISTENCIA — '+MES+' '+Y, {size:18, bold:true, fill: cierre ? 'FFFFE599' : 'FFD9EAD3', border:false});
    wr.getRow(1).height = 32;
    wr.mergeCells(2, 1, 2, heads.length);
    pon(wr, 2, 1, lineaNeg+'  ·  Corte: '+formatDateEs(m.corte)+(m.mesEnCurso ? '  (mes en curso: los días siguientes aún no cuentan)' : '')+'  ·  '+estadoTxt+'  ·  Generado: '+generado+(usuario ? ' por '+usuario : ''), {size:9, italic:true, h:'left', border:false});
    const sum = (k)=> filas.reduce((s, f)=> s + (f[k] || 0), 0);
    const tProg = sum('progTotal'), tAs = sum('ok'), tFa = sum('falt'), tJu = sum('just'), tLib = sum('libres'), tVac = sum('vac'), tPer = sum('perm'), tEx = sum('extra'), tSS = sum('sinSalida');
    const tAtr = sum('atrasos'), tMinAtr = sum('minAtraso'), tHm = sum('totalMins'), tExm = sum('extraMins'), tNoc = sum('noc');
    const sinSalidaTotal = m.novedades.filter(x=> x.tipo === 'ENTRADA SIN SALIDA').length;
    const kp = [[2, 3, 'CUMPLIMIENTO GLOBAL', (tAs + tFa) ? tAs / (tAs + tFa) : '', '0%'], [4, 6, 'FALTAS SIN JUSTIFICAR', tFa, '0'], [7, 9, 'FALTAS JUSTIFICADAS', tJu, '0'],
      [10, 13, 'ASISTIÓ SIN QUE LE TOCARA', tEx, '0'], [14, 17, 'ENTRADAS SIN SALIDA (TODO EL PERSONAL)', sinSalidaTotal, '0']];
    kp.forEach(k=>{
      wr.mergeCells(4, k[0], 4, k[1]);
      pon(wr, 4, k[0], k[2], {size:8, bold:true, fill:'FFC9DAF8'});
      wr.mergeCells(5, k[0], 5, k[1]);
      pon(wr, 5, k[0], k[3], {size:16, bold:true, fmt:k[4]});
    });
    wr.getRow(5).height = 28;
    heads.forEach((t, i)=>{ pon(wr, 7, i + 1, t, {size:8, bold:true, fill: t.indexOf('SIN JUSTIFICAR') >= 0 ? 'FFF4CCCC' : (t.indexOf('JUSTIFICADAS') >= 0 ? 'FFF9CB9C' : 'FFC9DAF8')}); });
    wr.getRow(7).height = 42;
    const idxHoras = 14 + (pun ? 2 : 0);
    filas.forEach((f, i)=>{
      const r = 8 + i;
      const cum = (f.ok + f.falt) ? f.ok / (f.ok + f.falt) : '';
      const vals = [i + 1, f.nombre, f.linea || lineaNeg, f.cargo, f.progTotal, f.ok, f.falt, f.just, cum, f.libres, f.vac, f.perm, f.extra, f.sinSalida]
        .concat(pun ? [f.atrasos, f.minAtraso] : [])
        .concat([dec(f.totalMins), horaTxt(f.extraMins), dec(f.extraMins), dec(f.noc), null]);
      vals.forEach((v, k)=>{
        const fmtK = (k === 8) ? '0%' : ((k === idxHoras || k === idxHoras + 2 || k === idxHoras + 3) ? '0.00' : undefined);
        pon(wr, r, k + 1, v, {size: k === 1 ? 11 : 10, h: k === 1 ? 'left' : 'center', bold: k === 6 || k === 8, color: (k === 6 && f.falt) ? 'FFC00000' : 'FF000000', fmt: fmtK});
      });
    });
    const rT = 8 + filas.length;
    const tot = ['', 'TOTAL', '', '', tProg, tAs, tFa, tJu, (tAs + tFa) ? tAs / (tAs + tFa) : '', tLib, tVac, tPer, tEx, tSS]
      .concat(pun ? [tAtr, tMinAtr] : []).concat([dec(tHm), horaTxt(tExm), dec(tExm), dec(tNoc), '']);
    tot.forEach((v, k)=>{ pon(wr, rT, k + 1, v, {size:10, bold:true, fill:'FFD9EAD3', fmt: k === 8 ? '0%' : ((k === idxHoras || k === idxHoras + 2 || k === idxHoras + 3) ? '0.00' : undefined)}); });
    wr.mergeCells(rT + 2, 1, rT + 2, heads.length);
    pon(wr, rT + 2, 1, 'Cómo se calcula: días asistidos = días con entrada registrada en una fecha en que le tocaba trabajar · faltas sin justificar = le tocaba y no hay entrada (hasta la fecha de corte) ni justificación · % de cumplimiento = asistidos ÷ (asistidos + faltas sin justificar). Las horas salen de la hora de entrada y de salida menos 1 hora de almuerzo (jornada normal hasta las 16:00, máximo 8 h); las horas extra cuentan desde la salida normal, en minutos reales, cuando la persona sale a partir de las 17:00. Horas nocturnas 25% = entre las 19:00 y las 06:00.'+
      (pun ? ' Atraso = entrada después de las '+pun.entrada+' más '+pun.tolerancia+' min de tolerancia, en días en que le tocaba trabajar.' : ''), {size:8, italic:true, h:'left', border:false});
    wr.getRow(rT + 2).height = 54;
    [['ELABORADO POR', 2, 3], ['REVISADO POR (JEFATURA)', 5, 9], ['APROBADO POR (RR. HH.)', 11, 15]].forEach(b=>{
      const r = rT + 6;
      wr.mergeCells(r, b[1], r, b[2]);
      for(let k = b[1]; k <= b[2]; k++) wr.getCell(r, k).border = {bottom:{style:'thin', color:{argb:'FF000000'}}};
      wr.mergeCells(r + 1, b[1], r + 1, b[2]);
      pon(wr, r + 1, b[1], b[0], {size:8, bold:true, border:false});
    });

    // ===== Hoja 3: NOVEDADES =====
    const wn = wb.addWorksheet('NOVEDADES', {views:[{state:'frozen', ySplit:4}], pageSetup:{orientation:'landscape', paperSize:9, fitToPage:true, fitToWidth:1, fitToHeight:0}});
    [24, 12, 12, 30, 20, 50, 36, 22].forEach((w, i)=>{ wn.getColumn(i + 1).width = w; });
    wn.mergeCells(1, 1, 1, 8);
    pon(wn, 1, 1, 'NOVEDADES DEL MES — '+MES+' '+Y, {size:16, bold:true, fill: cierre ? 'FFFFE599' : 'FFD9EAD3', border:false});
    wn.getRow(1).height = 28;
    wn.mergeCells(2, 1, 2, 8);
    pon(wn, 2, 1, 'Excepciones detectadas al comparar el cronograma con las entradas y salidas, y novedades registradas en la app. Lo que no tenga justificación ni autorización debe resolverse con la jefatura.', {size:9, italic:true, h:'left', border:false});
    ['TIPO','FECHA','DÍA','NOMBRE','CARGO','DETALLE','JUSTIFICACIÓN / MOTIVO','AUTORIZADO POR'].forEach((t, i)=>{ pon(wn, 4, i + 1, t, {size:9, bold:true, fill:'FFC9DAF8'}); });
    const colorNov = (t)=> t === 'FALTA' ? 'FFF4CCCC' : (t.indexOf('JUSTIFICADA') >= 0 || t.indexOf('AUTORIZADO') === 0 ? 'FFD9EAD3' : (t === 'ENTRADA SIN SALIDA' ? 'FFFCE5CD' : (t === 'ATRASO' ? 'FFFFE599' : 'FFFFF2CC')));
    m.novedades.forEach((n, i)=>{
      const r = 5 + i;
      [n.tipo, formatDateShort(n.d), DIAS_LARGO[parseDate(n.d).getDay()], n.nombre, n.cargo || '', n.detalle, n.justificacion || null, n.autoriza || null].forEach((v, k)=>{
        pon(wn, r, k + 1, v, {size:9, h: (k === 3 || k === 5 || k === 6) ? 'left' : 'center', fill: k === 0 ? colorNov(n.tipo) : undefined, bold: k === 0});
      });
    });
    if(!m.novedades.length){
      wn.mergeCells(5, 1, 5, 8);
      pon(wn, 5, 1, 'Sin novedades en el periodo.', {size:10, italic:true, border:false});
    }

    // ===== Hoja 4: MARCACIONES =====
    const wm = wb.addWorksheet('MARCACIONES', {views:[{state:'frozen', ySplit:4}], pageSetup:{orientation:'landscape', paperSize:9, fitToPage:true, fitToWidth:1, fitToHeight:0}});
    [12, 12, 32, 26, 10, 12, 13, 18, 18, 14, 12].forEach((w, i)=>{ wm.getColumn(i + 1).width = w; });
    wm.mergeCells(1, 1, 1, 11);
    pon(wm, 1, 1, 'ENTRADAS Y SALIDAS REGISTRADAS — '+MES+' '+Y, {size:16, bold:true, fill: cierre ? 'FFFFE599' : 'FFD9EAD3', border:false});
    wm.getRow(1).height = 28;
    wm.mergeCells(2, 1, 2, 11);
    pon(wm, 2, 1, 'Detalle de cada marcación hecha en la portería (evidencia del resumen). Incluye a todo el personal que registró entrada en el mes.', {size:9, italic:true, h:'left', border:false});
    ['FECHA','DÍA','NOMBRE','ÁREA','ENTRADA','SALIDA','DURACIÓN (h)','REGISTRÓ ENTRADA','REGISTRÓ SALIDA','EN CRONOGRAMA','ATRASO (min)'].forEach((t, i)=>{ pon(wm, 4, i + 1, t, {size:9, bold:true, fill:'FFC9DAF8'}); });
    m.marcaciones.forEach((x, i)=>{
      const r = 5 + i;
      [formatDateShort(x.d), DIAS_LARGO[parseDate(x.d).getDay()], x.name, x.area, x.entrada, x.sinSalida ? 'SIN SALIDA' : x.salida, x.mins == null ? '' : dec(x.mins), x.entradaPor, x.salidaPor, x.enCrono ? 'Sí' : 'No', x.tarde || ''].forEach((v, k)=>{
        pon(wm, r, k + 1, v, {size:9, h: (k === 2 || k === 3) ? 'left' : 'center', fmt: k === 6 ? '0.00' : undefined,
          fill: (k === 5 && v === 'SIN SALIDA') ? 'FFFCE5CD' : ((k === 10 && v) ? 'FFFFE599' : undefined), bold: (k === 5 && v === 'SIN SALIDA')});
      });
    });
    if(!m.marcaciones.length){
      wm.mergeCells(5, 1, 5, 11);
      pon(wm, 5, 1, 'No hay marcaciones en el periodo.', {size:10, italic:true, border:false});
    }

    // ===== Hoja 5: CAMBIOS (registro de quién cambió qué) =====
    const wc = wb.addWorksheet('CAMBIOS', {views:[{state:'frozen', ySplit:4}], pageSetup:{orientation:'landscape', paperSize:9, fitToPage:true, fitToWidth:1, fitToHeight:0}});
    [20, 26, 30, 90].forEach((w, i)=>{ wc.getColumn(i + 1).width = w; });
    wc.mergeCells(1, 1, 1, 4);
    pon(wc, 1, 1, 'REGISTRO DE CAMBIOS — '+MES+' '+Y, {size:16, bold:true, fill: cierre ? 'FFFFE599' : 'FFD9EAD3', border:false});
    wc.getRow(1).height = 28;
    wc.mergeCells(2, 1, 2, 4);
    pon(wc, 2, 1, 'Quién hizo cada cambio sobre las marcaciones y novedades de este mes, y cuándo. Este registro no se puede borrar desde la app.', {size:9, italic:true, h:'left', border:false});
    ['FECHA Y HORA','QUIÉN','ACCIÓN','DETALLE'].forEach((t, i)=>{ pon(wc, 4, i + 1, t, {size:9, bold:true, fill:'FFC9DAF8'}); });
    m.cambios.forEach((x, i)=>{
      [fechaHoraCorta(x.en), x.por, ACCION_TXT[x.accion] || x.accion, x.detalle].forEach((v, k)=>{ pon(wc, 5 + i, k + 1, v, {size:9, h: k === 3 ? 'left' : 'center'}); });
    });
    if(!m.cambios.length){
      wc.mergeCells(5, 1, 5, 4);
      pon(wc, 5, 1, 'No hay cambios registrados para este mes.', {size:10, italic:true, border:false});
    }

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'asistencia_'+MES+'_'+Y+(cierre ? '_CERRADO' : '')+'.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
    showToast('Hoja de asistencia descargada.');
  }

  function formatDateShort(d){ return d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4); }

  // ---------- ALERTA: salidas sin registrar ----------
  const ALERTA_HORA_DEFAULT = '16:30';
  function alertaHora(){ return state.alertaHora || ALERTA_HORA_DEFAULT; }

  function horaBonita(hhmm){          // '16:30' -> '4:30 p. m.'
    const p = String(hhmm || '').split(':').map(Number);
    if(p.length < 2 || isNaN(p[0]) || isNaN(p[1])) return String(hhmm || '');
    return ((p[0] % 12) || 12) + ':' + String(p[1]).padStart(2,'0') + (p[0] >= 12 ? ' p. m.' : ' a. m.');
  }

  // Quién sigue dentro pasada la hora límite: personal que no vive en la granja y visitantes
  // que entraron ANTES de esa hora (un reingreso posterior no es un olvido).
  function pendientesSalida(){
    const limite = alertaHora();
    if(nowTime() < limite) return {staff:[], visitors:[]};
    const today = todayStr();
    const staff = [];
    (state.recordsByDate[today] || []).forEach(r=>{
      if(r.salida) return;
      const p = state.staff.find(x=>x.id === r.staffId);
      if(p && p.resident) return;                 // los residentes viven en la granja
      if((r.entrada || '') >= limite) return;
      staff.push({r:r, p:p});
    });
    const visitors = (state.visitorsByDate[today] || []).filter(v=> !v.salida && (v.entrada || '') < limite);
    return {staff:staff, visitors:visitors};
  }

  function firmaAlerta(){
    const p = pendientesSalida();
    return alertaHora()+'|'+p.staff.map(x=>x.r.staffId+'@'+x.r.entrada).join(',')+'|'+p.visitors.map(v=>v.id).join(',');
  }

  function renderAlertaSalidas(){
    const pend = pendientesSalida();
    const total = pend.staff.length + pend.visitors.length;
    if(!total) return null;
    const puedeRegistrar = (state.session.role === 'guardia' || state.session.role === 'admin');

    const box = document.createElement('div');
    box.className = 'alerta-salidas';
    box.setAttribute('role','alert');
    box.innerHTML =
      '<div class="al-head"><div class="al-ic">'+icon('alert',22)+'</div><div>'+
        '<div class="al-title">'+(total === 1 ? 'Falta registrar 1 salida' : 'Faltan registrar '+total+' salidas')+'</div>'+
        '<div class="al-sub">Siguen dentro pasadas las '+escapeHtml(horaBonita(alertaHora()))+' Si ya se fueron, registra su salida.</div>'+
      '</div></div>';

    const list = document.createElement('div');
    list.className = 'al-list';
    function fila(nombre, detalle, onRegistrar){
      const row = document.createElement('div');
      row.className = 'al-row';
      row.innerHTML = '<div class="who"><div class="n">'+escapeHtml(nombre)+'</div><div class="d">'+escapeHtml(detalle)+'</div></div>';
      if(puedeRegistrar){
        const b = document.createElement('button');
        b.className = 'action';
        b.innerHTML = icon('logout',16)+'Registrar salida';
        b.onclick = ()=>{
          if(!window.confirm('¿Registrar la salida de '+nombre+' ahora ('+nowTime()+')?')) return;
          onRegistrar();
        };
        row.appendChild(b);
      }
      list.appendChild(row);
    }
    pend.staff.forEach(({r, p})=>{
      const persona = p || {id:r.staffId, name:r.name, area:r.area};
      fila(r.name, (r.area ? r.area+' · ' : '')+'Entró '+r.entrada, ()=> registrarSalidaStaff(persona));
    });
    pend.visitors.forEach(v=>{
      fila(v.name, 'Visitante'+(v.motivo ? ' · '+v.motivo : '')+' · Entró '+v.entrada, ()=> closeVisitor(v.id));
    });
    box.appendChild(list);

    if(puedeRegistrar){
      const nota = document.createElement('div');
      nota.className = 'al-note';
      nota.textContent = 'La salida se guarda con la hora de ahora. Si se fue antes, el super usuario puede corregir la hora en Reporte.';
      box.appendChild(nota);
    }
    return box;
  }

  // Revisa cada 20 s si la alerta cambió (por ejemplo, al llegar la hora límite) y solo entonces vuelve a dibujar.
  setInterval(()=>{
    if(!state.session) return;
    if(firmaAlerta() !== ultimaFirmaAlerta) render();
  }, 20000);

  function isValidTime(v){
    return /^([01]\d|2[0-3]):[0-5]\d$/.test(v);
  }

  async function editStaffRecord(date, ref){
    const cierre = await mesCerradoFecha(date);
    if(cierre){ avisoMesCerrado(cierre, date); return; }
    const antes = {entrada: ref.entrada || '', salida: ref.salida || ''};
    const nuevaEntrada = window.prompt('Hora de entrada (HH:MM), vacío para dejar igual:', ref.entrada||'');
    if(nuevaEntrada===null) return;
    if(nuevaEntrada.trim()){
      if(!isValidTime(nuevaEntrada.trim())){ showToast('Formato de hora inválido, usa HH:MM.'); return; }
      ref.entrada = nuevaEntrada.trim();
    }
    const nuevaSalida = window.prompt('Hora de salida (HH:MM), vacío para dejar igual, escribe "-" para borrarla:', ref.salida||'');
    const auditarEdicion = ()=>{
      const cambios = [];
      if((ref.entrada || '') !== antes.entrada) cambios.push('entrada '+(antes.entrada || '—')+' → '+(ref.entrada || '—'));
      if((ref.salida || '') !== antes.salida) cambios.push('salida '+(antes.salida || '—')+' → '+(ref.salida || '—'));
      if(cambios.length) registrarAuditoria('editar_registro', ref.name+' · '+formatDateEs(date)+' · '+cambios.join(' · '), date, {staffId: ref.staffId});
    };
    if(nuevaSalida===null){ await saveRecords(date); auditarEdicion(); render(); return; }
    if(nuevaSalida.trim()==='-'){ ref.salida = null; }
    else if(nuevaSalida.trim()){
      if(!isValidTime(nuevaSalida.trim())){ showToast('Formato de hora inválido, usa HH:MM.'); return; }
      ref.salida = nuevaSalida.trim();
    }
    await saveRecords(date);
    auditarEdicion();
    showToast('Registro actualizado.');
    render();
  }

  async function deleteStaffRecord(date, ref){
    const cierre = await mesCerradoFecha(date);
    if(cierre){ avisoMesCerrado(cierre, date); return; }
    if(!window.confirm('¿Eliminar este movimiento de '+ref.name+'? Esta acción no se puede deshacer.')) return;
    const arr = state.recordsByDate[date] || [];
    const idx = arr.indexOf(ref);
    if(idx>-1) arr.splice(idx,1);
    await saveRecords(date);
    registrarAuditoria('eliminar_registro', ref.name+' · '+formatDateEs(date)+' · entrada '+(ref.entrada || '—')+' · salida '+(ref.salida || '—'), date, {staffId: ref.staffId});
    showToast('Movimiento eliminado.');
    render();
  }

  async function editVisitorRecord(date, v){
    const antesV = {entrada: v.entrada || '', salida: v.salida || ''};
    const nuevaEntrada = window.prompt('Hora de entrada (HH:MM), vacío para dejar igual:', v.entrada||'');
    if(nuevaEntrada===null) return;
    if(nuevaEntrada.trim()){
      if(!isValidTime(nuevaEntrada.trim())){ showToast('Formato de hora inválido, usa HH:MM.'); return; }
      v.entrada = nuevaEntrada.trim();
    }
    const nuevaSalida = window.prompt('Hora de salida (HH:MM), vacío para dejar igual, escribe "-" para borrarla:', v.salida||'');
    const auditarV = ()=>{
      const cambios = [];
      if((v.entrada || '') !== antesV.entrada) cambios.push('entrada '+(antesV.entrada || '—')+' → '+(v.entrada || '—'));
      if((v.salida || '') !== antesV.salida) cambios.push('salida '+(antesV.salida || '—')+' → '+(v.salida || '—'));
      if(cambios.length) registrarAuditoria('editar_visitante', (v.name || 'Visitante')+' · '+formatDateEs(date)+' · '+cambios.join(' · '), date);
    };
    if(nuevaSalida===null){ await saveVisitors(date); auditarV(); render(); return; }
    if(nuevaSalida.trim()==='-'){ v.salida = null; }
    else if(nuevaSalida.trim()){
      if(!isValidTime(nuevaSalida.trim())){ showToast('Formato de hora inválido, usa HH:MM.'); return; }
      v.salida = nuevaSalida.trim();
    }
    await saveVisitors(date);
    auditarV();
    showToast('Registro actualizado.');
    render();
  }

  async function deleteVisitorRecord(date, id){
    if(!window.confirm('¿Eliminar esta visita? Esta acción no se puede deshacer.')) return;
    const visEliminada = (state.visitorsByDate[date]||[]).find(x=>x.id===id);
    state.visitorsByDate[date] = (state.visitorsByDate[date]||[]).filter(x=>x.id!==id);
    await saveVisitors(date);
    registrarAuditoria('eliminar_visitante', (visEliminada ? visEliminada.name : 'Visita')+' · '+formatDateEs(date)+(visEliminada ? ' · entrada '+(visEliminada.entrada || '—')+' · salida '+(visEliminada.salida || '—') : ''), date);
    showToast('Visita eliminada.');
    render();
  }

  function calcMinutos(entrada, salida){
    if(!entrada || !salida) return null;
    const [eh, em] = entrada.split(':').map(Number);
    const [sh, sm] = salida.split(':').map(Number);
    let mins = (sh*60+sm) - (eh*60+em);
    if(mins < 0) mins += 24*60;
    return mins;
  }

  function minsToLabel(mins){
    if(mins==null) return null;
    const h = Math.floor(mins/60);
    const m = mins % 60;
    return h + 'h ' + String(m).padStart(2,'0') + 'm';
  }

  function calcHoras(entrada, salida){
    return minsToLabel(calcMinutos(entrada, salida));
  }

  // Agrupa las sesiones (entrada/salida) de un área por persona.
  // Si alguien reingresó (turno extra), cada sesión queda como su propia fila
  // bajo el mismo nombre, y se agrega una fila de total al final.
  function buildPersonRows(records){
    const byPerson = {};
    const order = [];
    records.forEach(r=>{
      if(!byPerson[r.staffId]){ byPerson[r.staffId] = []; order.push(r.staffId); }
      byPerson[r.staffId].push(r);
    });
    const rows = [];
    order.forEach(staffId=>{
      const sessions = byPerson[staffId].slice().sort((a,b)=>(a.entrada||'').localeCompare(b.entrada||''));
      let totalMins = 0;
      sessions.forEach((s,idx)=>{
        const mins = calcMinutos(s.entrada, s.salida);
        if(mins!=null) totalMins += mins;
        rows.push({
          name: idx===0 ? sessions[0].name : sessions[0].name + ' (turno extra)',
          entrada: s.entrada || '—',
          entradaPor: s.entradaPor || '—',
          salida: s.salida || '—',
          salidaPor: s.salidaPor || '—',
          horas: minsToLabel(mins) || '—',
          extra: idx>0,
          ref: s
        });
      });
      if(sessions.length>1){
        rows.push({
          name: 'Total ' + sessions[0].name,
          entrada: '', entradaPor:'', salida: '', salidaPor:'', horas: minsToLabel(totalMins) || '—', isTotal: true
        });
      }
    });
    return rows;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderLockScreen(){
    const app = document.getElementById('app');
    app.innerHTML = '';
    const outer = document.createElement('div');
    outer.id = 'lock-screen';
    const card = document.createElement('div');
    card.className = 'lock-card';
    card.innerHTML = '<div class="lock-logo">'+icon('shield',32)+'</div><h1>Portería</h1><p>Control de acceso · Ingresa tu PIN para continuar</p>';
    const input = document.createElement('input');
    input.type = 'password';
    input.inputMode = 'numeric';
    input.maxLength = 8;
    input.placeholder = '••••';
    const err = document.createElement('div');
    err.className = 'err';
    err.textContent = state.loginError || '';
    const btn = document.createElement('button');
    btn.className = 'action';
    btn.style.width = '100%';
    btn.textContent = 'Entrar';
    const tryLogin = async ()=>{
      const val = input.value.trim();
      if(!val) return;
      if(!state.pins.guardiaHash || !state.pins.adminHash){
        state.loginError = 'Conectando con la nube, espera un momento…';
        render();
        return;
      }
      let hash;
      try{
        hash = await sha256Hex(val);
      }catch(e){
        state.loginError = 'Este acceso solo funciona en el link https:// publicado.';
        render();
        return;
      }
      const guardia = state.guardias.find(g=>g.pinHash===hash);
      const administrativo = state.administrativos.find(a=>a.pinHash===hash);
      if(hash === state.pins.adminHash){
        state.session = {role:'admin'};
        localStorage.setItem('porteria_session', JSON.stringify(state.session));
        state.loginError = '';
        render();
      } else if(guardia){
        state.session = {role:'guardia', guardId: guardia.id, guardName: guardia.nombre};
        localStorage.setItem('porteria_session', JSON.stringify(state.session));
        state.loginError = '';
        render();
      } else if(administrativo){
        state.session = {role:'administrativo', nombre: administrativo.nombre};
        localStorage.setItem('porteria_session', JSON.stringify(state.session));
        state.loginError = '';
        render();
      } else if(hash === state.pins.guardiaHash){
        state.session = {role:'guardia', guardId:null, guardName:'Guardia'};
        localStorage.setItem('porteria_session', JSON.stringify(state.session));
        state.loginError = '';
        render();
      } else {
        state.loginError = 'PIN incorrecto.';
        render();
      }
    };
    btn.onclick = tryLogin;
    input.onkeydown = (e)=>{ if(e.key==='Enter') tryLogin(); };
    card.appendChild(input);
    card.appendChild(err);
    card.appendChild(btn);
    const ver = document.createElement('div');
    ver.className = 'lock-ver';
    ver.textContent = APP_VERSION;
    card.appendChild(ver);
    outer.appendChild(card);
    app.appendChild(outer);
    setTimeout(()=> input.focus(), 0);
  }

  function logout(){
    state.session = null;
    localStorage.removeItem('porteria_session');
    render();
  }

  const savedSession = localStorage.getItem('porteria_session');
  if(savedSession){
    try{
      const parsed = JSON.parse(savedSession);
      if(parsed && TABS_BY_ROLE[parsed.role]) state.session = parsed;
    }catch(e){}
  }

  bootstrapAndListen();
})();
</script>
