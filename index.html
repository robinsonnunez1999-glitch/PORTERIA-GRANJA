  // ---- Pestaña Nómina → Comparativa: días programados contra días asistidos ----
  function renderComparativa(wrap, c){
    const start = c.start, end = c.end, dates = c.dates, today = c.today, mode = c.mode;
    const meses = Array.from(new Set([start.slice(0,7), end.slice(0,7)]));
    let fallo = false, cargando = false;
    meses.forEach(ym=>{
      if(state.horarioCache[ym] !== undefined) return;
      if(state.horarioFailed[ym]) fallo = true;
      else { cargando = true; setTimeout(()=> loadHorarioMes(ym), 0); }
    });
    if(fallo || cargando){
      const st = document.createElement('div');
      st.className = 'card empty';
      if(fallo){
        st.innerHTML = '<div class="ic-big">'+icon('refresh',24)+'</div>No se pudo cargar el horario.';
        const retry = document.createElement('button');
        retry.className = 'action secundario'; retry.style.marginTop = '14px'; retry.textContent = 'Reintentar';
        retry.onclick = ()=>{ state.horarioFailed = {}; render(); };
        st.appendChild(retry);
      } else st.innerHTML = '<div class="spinner"></div>Cargando el horario…';
      wrap.appendChild(st);
      return;
    }

    const porStaff = {}; let orden = 0;
    meses.forEach(ym=>{
      const h = state.horarioCache[ym];
      if(!h || !h.rows) return;
      h.rows.forEach(r=>{
        let o = porStaff[r.staffId];
        if(!o) o = porStaff[r.staffId] = {staffId:r.staffId, name:r.name, cargo:r.cargo || '', days:{}, orden:orden++};
        Object.assign(o.days, r.days);
      });
    });
    let filas = Object.keys(porStaff).map(k=> porStaff[k]);
    if(!filas.length){
      const e = document.createElement('div');
      e.className = 'card empty';
      e.innerHTML = '<div class="ic-big">'+icon('calendar',24)+'</div>Todavía no hay un horario cargado para este periodo.'+
        (state.session.role === 'admin' ? '<br><span style="font-size:12.5px;">Cárgalo en Configuración → Horario de trabajo.</span>' : '');
      wrap.appendChild(e);
      return;
    }

    const asist = {};
    c.allRows.forEach(r=>{ asist[r.id] = r.cells; });
    filas.forEach(f=>{
      const p = state.staff.find(x=> x.id === f.staffId);
      f.nombre = p ? p.name : f.name;
      f.area = p ? p.area : 'Sin área';
      f.est = {}; f.hubo = {};
      f.ok = 0; f.falt = 0; f.extra = 0;
      dates.forEach(d=>{
        const v = f.days[d];
        const prog = (typeof v === 'number') ? 'T' : (v === 'L' ? 'L' : (v ? 'O' : ''));
        const hubo = !!(asist[f.staffId] && asist[f.staffId][d]);
        let e;
        if(prog === 'T') e = hubo ? 'ok' : (d < today ? 'falta' : (d === today ? 'hoy' : 'prog'));
        else if(hubo) e = (prog === '') ? 'sinh' : 'extra';
        else e = (prog === 'L') ? 'libre' : (prog === 'O' ? 'otro' : 'nada');
        f.est[d] = e; f.hubo[d] = hubo;
        if(e === 'ok') f.ok++;
        if(e === 'falta') f.falt++;
        if(e === 'extra') f.extra++;
      });
    });
    if(state.nominaArea !== 'todas') filas = filas.filter(f=> f.area === state.nominaArea);
    filas.sort((a,b)=> a.area.localeCompare(b.area,'es') || a.orden - b.orden);

    if(!filas.length){
      const e = document.createElement('div');
      e.className = 'card empty';
      e.innerHTML = '<div class="ic-big">'+icon('inbox',24)+'</div>No hay personas con horario en esta área.';
      wrap.appendChild(e);
      return;
    }

    const tOk = filas.reduce((s,f)=> s + f.ok, 0), tFalt = filas.reduce((s,f)=> s + f.falt, 0), tExtra = filas.reduce((s,f)=> s + f.extra, 0);
    const cumpl = (tOk + tFalt) ? Math.round(tOk * 100 / (tOk + tFalt)) : null;

    const stats = document.createElement('div');
    stats.className = 'nm-stats';
    stats.innerHTML =
      '<div class="nm-stat hl"><div class="num">'+(cumpl == null ? '–' : cumpl+'<small>%</small>')+'</div><div class="lbl">Cumplimiento del horario</div></div>'+
      '<div class="nm-stat"><div class="num" style="color:'+(tFalt ? 'var(--danger)' : 'inherit')+'">'+tFalt+'</div><div class="lbl">Faltas (les tocaba y no vinieron)</div></div>'+
      '<div class="nm-stat"><div class="num">'+tOk+'</div><div class="lbl">Días cumplidos</div></div>'+
      '<div class="nm-stat"><div class="num">'+tExtra+'</div><div class="lbl">Trabajó en día libre</div></div>';
    wrap.appendChild(stats);

    const legend = document.createElement('div');
    legend.className = 'nm-legend';
    legend.style.margin = '0 2px 12px';
    legend.innerHTML =
      '<span><i style="background:var(--brand)"></i>Asistió</span>'+
      '<span><i style="background:#C9503E"></i>Falta</span>'+
      '<span><i style="background:#F2C66B"></i>Trabajó en libre</span>'+
      '<span><i style="background:#EAF3EC;border:1px solid #BFD8C8"></i>Le toca</span>'+
      '<span><i style="background:#F0EEE6;border:1px solid var(--line)"></i>Libre</span>';
    wrap.appendChild(legend);

    const nomEst = {ok:'Asistió', falta:'Falta', hoy:'Hoy: aún no registra entrada', prog:'Le toca trabajar', libre:'Día libre', extra:'Trabajó en su día libre', sinh:'Asistió (sin horario cargado ese día)', otro:'Otro', nada:'Sin horario'};
    function celda(f, d){
      const e = f.est[d];
      const tip = ' title="'+escapeHtml(formatDateEs(d)+': '+nomEst[e])+'"';
      if(e === 'ok') return '<td class="c k k-ok"'+tip+'>'+icon('check',16)+'</td>';
      if(e === 'falta') return '<td class="c k k-falta"'+tip+'>'+icon('x',16)+'</td>';
      if(e === 'extra') return '<td class="c k k-extra"'+tip+'>'+icon('plus',16)+'</td>';
      if(e === 'sinh') return '<td class="c k k-sinh"'+tip+'>'+icon('check',16)+'</td>';
      if(e === 'hoy') return '<td class="c k k-hoy"'+tip+'>…</td>';
      if(e === 'prog') return '<td class="c k k-prog"'+tip+'>•</td>';
      if(e === 'libre') return '<td class="c k k-libre"'+tip+'>L</td>';
      if(e === 'otro') return '<td class="c k k-otro"'+tip+'>'+escapeHtml(String(f.days[d]))+'</td>';
      return '<td class="c k"></td>';
    }
    const headCols = dates.map(d=>{
      const dt = parseDate(d), i = (dt.getDay() + 6) % 7, wk = (i >= 5) ? ' wk' : '';
      return mode === 'semana'
        ? '<th class="c'+wk+'">'+DOW_PDF[i]+'<small>'+d.slice(8)+'/'+d.slice(5,7)+'</small></th>'
        : '<th class="c'+wk+'">'+DOW_LETTER_MON[i]+'<small>'+Number(d.slice(8))+'</small></th>';
    }).join('');

    const byArea = {};
    filas.forEach(f=>{ (byArea[f.area] = byArea[f.area] || []).push(f); });
    const areaOrder = Object.keys(byArea).sort((a,b)=> a.localeCompare(b,'es'));
    let body = '';
    areaOrder.forEach(area=>{
      body += '<tr class="nm-area"><td class="nm-name">'+escapeHtml(area)+'</td><td colspan="'+(dates.length + 2)+'">'+byArea[area].filter(f=>f.falt).length+' con faltas</td></tr>';
      byArea[area].forEach(f=>{
        body += '<tr><td class="nm-name">'+escapeHtml(f.nombre)+(f.cargo ? '<small class="cg">'+escapeHtml(f.cargo)+'</small>' : '')+'</td>'+
          dates.map(d=> celda(f, d)).join('')+
          '<td class="nm-sum">'+f.ok+'</td><td class="nm-sum'+(f.falt ? ' bad' : '')+'">'+f.falt+'</td></tr>';
      });
    });
    const progDia = {}, asisDia = {};
    dates.forEach(d=>{
      progDia[d] = filas.filter(f=> typeof f.days[d] === 'number').length;
      asisDia[d] = filas.filter(f=> f.hubo[d]).length;
    });
    const foot =
      '<tr><td class="nm-name">Programados</td>'+dates.map(d=>'<td class="c">'+progDia[d]+'</td>').join('')+'<td class="nm-sum"></td><td class="nm-sum"></td></tr>'+
      '<tr><td class="nm-name">Asistieron</td>'+dates.map(d=>'<td class="c">'+(d > today ? '' : asisDia[d])+'</td>').join('')+'<td class="nm-sum">'+tOk+'</td><td class="nm-sum">'+tFalt+'</td></tr>';

    const tableCard = document.createElement('div');
    tableCard.className = 'card nm-card';
    tableCard.innerHTML =
      '<div class="nm-grid-wrap"><table class="nm-grid '+(mode === 'semana' ? 'sem' : 'mes')+'">'+
      '<thead><tr><th class="nm-name">Nombres</th>'+headCols+'<th class="nm-sum">Asist.</th><th class="nm-sum">Faltas</th></tr></thead>'+
      '<tbody>'+body+'</tbody><tfoot>'+foot+'</tfoot></table></div>';
    wrap.appendChild(tableCard);

    // ---- exportar ----
    const txt = {ok:'Asistió', falta:'Falta', hoy:'Pendiente hoy', prog:'Le toca', libre:'Libre', extra:'Trabajó en libre', sinh:'Asistió', otro:'Otro', nada:''};
    const letra = {ok:'A', falta:'F', hoy:'…', prog:'·', libre:'L', extra:'+', sinh:'A', otro:'?', nada:''};
    const actions = document.createElement('div');
    actions.className = 'card row wrap';
    const btnCsv = document.createElement('button');
    btnCsv.className = 'action';
    btnCsv.innerHTML = icon('download',18)+'Descargar CSV';
    btnCsv.onclick = ()=>{
      const head = ['Nombre','Cargo','Área'].concat(dates.map(d=> d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4))).concat(['Asistió','Faltas','Trabajó en libre','Cumplimiento %']);
      let csv = head.map(csvEscape).join(',')+'\n';
      filas.forEach(f=>{
        const cu = (f.ok + f.falt) ? Math.round(f.ok * 100 / (f.ok + f.falt)) : '';
        csv += [f.nombre, f.cargo, f.area].concat(dates.map(d=> txt[f.est[d]])).concat([f.ok, f.falt, f.extra, cu]).map(csvEscape).join(',')+'\n';
      });
      downloadFile('comparativa_horario_'+(mode==='semana' ? 'semana_' : 'mes_')+start+'.csv', '\ufeff'+csv, 'text/csv;charset=utf-8');
    };
    const btnPdf = document.createElement('button');
    btnPdf.className = 'action secundario';
    btnPdf.innerHTML = icon('file',18)+'Generar PDF';
    btnPdf.onclick = ()=>{
      const dl = (d)=>{ const i = (parseDate(d).getDay() + 6) % 7; return mode === 'semana' ? DOW_PDF[i]+' '+d.slice(8)+'/'+d.slice(5,7) : String(Number(d.slice(8))); };
      const headers = ['Nombres'].concat(dates.map(dl)).concat(['Asist.','Faltas']);
      const sections = areaOrder.map(area=>({
        heading: area, headers: headers,
        rows: byArea[area].map(f=> [f.nombre].concat(dates.map(d=> letra[f.est[d]])).concat([String(f.ok), String(f.falt)]))
      }));
      sections.push({heading:'', headers: headers, rows: [
        ['Programados'].concat(dates.map(d=> String(progDia[d]))).concat(['','']),
        ['Asistieron'].concat(dates.map(d=> d > today ? '' : String(asisDia[d]))).concat([String(tOk), String(tFalt)])
      ]});
      const sub = c.label + (state.nominaArea !== 'todas' ? ' · '+state.nominaArea : '')+'  —  A = asistió · F = falta · L = libre · + = trabajó en libre · · = le toca';
      const colStyles = {0:{cellWidth: mode === 'mes' ? 34 : 38, halign:'left'}};
      for(let i = 1; i < headers.length; i++) colStyles[i] = {halign:'center'};
      generarPdf('comparativa_horario_'+(mode==='semana' ? 'semana_' : 'mes_')+start+'.pdf', 'Comparativa · Horario y asistencia', sub, sections,
        mode === 'mes' ? {orientation:'landscape', fontSize:6.5, cellPadding:1.4, columnStyles:colStyles}
                       : {fontSize:8.5, cellPadding:2.2, columnStyles:colStyles});
    };
    actions.appendChild(btnCsv); actions.appendChild(btnPdf);
    wrap.appendChild(actions);

    const note = document.createElement('div');
    note.className = 'card';
    note.innerHTML = '<p class="nm-note"><b>Cómo se compara:</b> un día cuenta como <b>asistió</b> si el guardia registró la entrada de esa persona ese día. Si le tocaba trabajar y no hay registro, es una <b>falta</b> (los días de hoy y los que vienen no cuentan hasta que pasen). Si no le tocaba (día libre) y vino, aparece como <b>trabajó en libre</b>. El cumplimiento es días cumplidos ÷ (cumplidos + faltas). Se va actualizando solo a medida que se registran las entradas.</p>';
    wrap.appendChild(note);
  }

  // ---------- ALERTA: salidas sin registrar ----------
  const ALERTA_HORA_DEFAULT = '16:30';
  function alertaHora(){ return state.alertaHora || ALERTA_HORA_DEFAULT; }

  function horaBonita(hhmm){          // '16:30' -> '4:30 p. m.'
    const p = String(hhmm || '').split(':').map(Number);
    if(p.length < 2 || isNaN(p[0]) || isNaN(p[1])) return String(hhmm || '');
    return ((p[0] % 12) || 12) + ':' + String(p[1]).padStart(2,'0') + (p[0] >= 12 ? ' p. m.' : ' a. m.');
  }

  // Quién sigue dentro pasada la hora límite: personal que no vive en la granja y visitantes
  // que entraron ANTES de esa hora (un reingreso posterior no es un olvido).
  function pendientesSalida(){
    const limite = alertaHora();
    if(nowTime() < limite) return {staff:[], visitors:[]};
    const today = todayStr();
    const staff = [];
    (state.recordsByDate[today] || []).forEach(r=>{
      if(r.salida) return;
      const p = state.staff.find(x=>x.id === r.staffId);
      if(p && p.resident) return;                 // los residentes viven en la granja
      if((r.entrada || '') >= limite) return;
      staff.push({r:r, p:p});
    });
    const visitors = (state.visitorsByDate[today] || []).filter(v=> !v.salida && (v.entrada || '') < limite);
    return {staff:staff, visitors:visitors};
  }

  function firmaAlerta(){
    const p = pendientesSalida();
    return alertaHora()+'|'+p.staff.map(x=>x.r.staffId+'@'+x.r.entrada).join(',')+'|'+p.visitors.map(v=>v.id).join(',');
  }

  function renderAlertaSalidas(){
    const pend = pendientesSalida();
    const total = pend.staff.length + pend.visitors.length;
    if(!total) return null;
    const puedeRegistrar = (state.session.role === 'guardia' || state.session.role === 'admin');

    const box = document.createElement('div');
    box.className = 'alerta-salidas';
    box.setAttribute('role','alert');
    box.innerHTML =
      '<div class="al-head"><div class="al-ic">'+icon('alert',22)+'</div><div>'+
        '<div class="al-title">'+(total === 1 ? 'Falta registrar 1 salida' : 'Faltan registrar '+total+' salidas')+'</div>'+
        '<div class="al-sub">Siguen dentro pasadas las '+escapeHtml(horaBonita(alertaHora()))+' Si ya se fueron, registra su salida.</div>'+
      '</div></div>';

    const list = document.createElement('div');
    list.className = 'al-list';
    function fila(nombre, detalle, onRegistrar){
      const row = document.createElement('div');
      row.className = 'al-row';
      row.innerHTML = '<div class="who"><div class="n">'+escapeHtml(nombre)+'</div><div class="d">'+escapeHtml(detalle)+'</div></div>';
      if(puedeRegistrar){
        const b = document.createElement('button');
        b.className = 'action';
        b.innerHTML = icon('logout',16)+'Registrar salida';
        b.onclick = ()=>{
          if(!window.confirm('¿Registrar la salida de '+nombre+' ahora ('+nowTime()+')?')) return;
          onRegistrar();
        };
        row.appendChild(b);
      }
      list.appendChild(row);
    }
    pend.staff.forEach(({r, p})=>{
      const persona = p || {id:r.staffId, name:r.name, area:r.area};
      fila(r.name, (r.area ? r.area+' · ' : '')+'Entró '+r.entrada, ()=> registrarSalidaStaff(persona));
    });
    pend.visitors.forEach(v=>{
      fila(v.name, 'Visitante'+(v.motivo ? ' · '+v.motivo : '')+' · Entró '+v.entrada, ()=> closeVisitor(v.id));
    });
    box.appendChild(list);

    if(puedeRegistrar){
      const nota = document.createElement('div');
      nota.className = 'al-note';
      nota.textContent = 'La salida se guarda con la hora de ahora. Si se fue antes, el super usuario puede corregir la hora en Reporte.';
      box.appendChild(nota);
    }
    return box;
  }

  // Revisa cada 20 s si la alerta cambió (por ejemplo, al llegar la hora límite) y solo entonces vuelve a dibujar.
  setInterval(()=>{
    if(!state.session) return;
    if(firmaAlerta() !== ultimaFirmaAlerta) render();
  }, 20000);

  function isValidTime(v){
    return /^([01]\d|2[0-3]):[0-5]\d$/.test(v);
  }

  async function editStaffRecord(date, ref){
    const nuevaEntrada = window.prompt('Hora de entrada (HH:MM), vacío para dejar igual:', ref.entrada||'');
    if(nuevaEntrada===null) return;
    if(nuevaEntrada.trim()){
      if(!isValidTime(nuevaEntrada.trim())){ showToast('Formato de hora inválido, usa HH:MM.'); return; }
      ref.entrada = nuevaEntrada.trim();
    }
    const nuevaSalida = window.prompt('Hora de salida (HH:MM), vacío para dejar igual, escribe "-" para borrarla:', ref.salida||'');
    if(nuevaSalida===null){ await saveRecords(date); render(); return; }
    if(nuevaSalida.trim()==='-'){ ref.salida = null; }
    else if(nuevaSalida.trim()){
      if(!isValidTime(nuevaSalida.trim())){ showToast('Formato de hora inválido, usa HH:MM.'); return; }
      ref.salida = nuevaSalida.trim();
    }
    await saveRecords(date);
    showToast('Registro actualizado.');
    render();
  }

  async function deleteStaffRecord(date, ref){
    if(!window.confirm('¿Eliminar este movimiento de '+ref.name+'? Esta acción no se puede deshacer.')) return;
    const arr = state.recordsByDate[date] || [];
    const idx = arr.indexOf(ref);
    if(idx>-1) arr.splice(idx,1);
    await saveRecords(date);
    showToast('Movimiento eliminado.');
    render();
  }

  async function editVisitorRecord(date, v){
    const nuevaEntrada = window.prompt('Hora de entrada (HH:MM), vacío para dejar igual:', v.entrada||'');
    if(nuevaEntrada===null) return;
    if(nuevaEntrada.trim()){
      if(!isValidTime(nuevaEntrada.trim())){ showToast('Formato de hora inválido, usa HH:MM.'); return; }
      v.entrada = nuevaEntrada.trim();
    }
    const nuevaSalida = window.prompt('Hora de salida (HH:MM), vacío para dejar igual, escribe "-" para borrarla:', v.salida||'');
    if(nuevaSalida===null){ await saveVisitors(date); render(); return; }
    if(nuevaSalida.trim()==='-'){ v.salida = null; }
    else if(nuevaSalida.trim()){
      if(!isValidTime(nuevaSalida.trim())){ showToast('Formato de hora inválido, usa HH:MM.'); return; }
      v.salida = nuevaSalida.trim();
    }
    await saveVisitors(date);
    showToast('Registro actualizado.');
    render();
  }

  async function deleteVisitorRecord(date, id){
    if(!window.confirm('¿Eliminar esta visita? Esta acción no se puede deshacer.')) return;
    state.visitorsByDate[date] = (state.visitorsByDate[date]||[]).filter(x=>x.id!==id);
    await saveVisitors(date);
    showToast('Visita eliminada.');
    render();
  }

  function calcMinutos(entrada, salida){
    if(!entrada || !salida) return null;
    const [eh, em] = entrada.split(':').map(Number);
    const [sh, sm] = salida.split(':').map(Number);
    let mins = (sh*60+sm) - (eh*60+em);
    if(mins < 0) mins += 24*60;
    return mins;
  }

  function minsToLabel(mins){
    if(mins==null) return null;
    const h = Math.floor(mins/60);
    const m = mins % 60;
    return h + 'h ' + String(m).padStart(2,'0') + 'm';
  }

  function calcHoras(entrada, salida){
    return minsToLabel(calcMinutos(entrada, salida));
  }

  // Agrupa las sesiones (entrada/salida) de un área por persona.
  // Si alguien reingresó (turno extra), cada sesión queda como su propia fila
  // bajo el mismo nombre, y se agrega una fila de total al final.
  function buildPersonRows(records){
    const byPerson = {};
    const order = [];
    records.forEach(r=>{
      if(!byPerson[r.staffId]){ byPerson[r.staffId] = []; order.push(r.staffId); }
      byPerson[r.staffId].push(r);
    });
    const rows = [];
    order.forEach(staffId=>{
      const sessions = byPerson[staffId].slice().sort((a,b)=>(a.entrada||'').localeCompare(b.entrada||''));
      let totalMins = 0;
      sessions.forEach((s,idx)=>{
        const mins = calcMinutos(s.entrada, s.salida);
        if(mins!=null) totalMins += mins;
        rows.push({
          name: idx===0 ? sessions[0].name : sessions[0].name + ' (turno extra)',
          entrada: s.entrada || '—',
          entradaPor: s.entradaPor || '—',
          salida: s.salida || '—',
          salidaPor: s.salidaPor || '—',
          horas: minsToLabel(mins) || '—',
          extra: idx>0,
          ref: s
        });
      });
      if(sessions.length>1){
        rows.push({
          name: 'Total ' + sessions[0].name,
          entrada: '', entradaPor:'', salida: '', salidaPor:'', horas: minsToLabel(totalMins) || '—', isTotal: true
        });
      }
    });
    return rows;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderLockScreen(){
    const app = document.getElementById('app');
    app.innerHTML = '';
    const outer = document.createElement('div');
    outer.id = 'lock-screen';
    const card = document.createElement('div');
    card.className = 'lock-card';
    card.innerHTML = '<div class="lock-logo">'+icon('shield',32)+'</div><h1>Portería</h1><p>Control de acceso · Ingresa tu PIN para continuar</p>';
    const input = document.createElement('input');
    input.type = 'password';
    input.inputMode = 'numeric';
    input.maxLength = 8;
    input.placeholder = '••••';
    const err = document.createElement('div');
    err.className = 'err';
    err.textContent = state.loginError || '';
    const btn = document.createElement('button');
    btn.className = 'action';
    btn.style.width = '100%';
    btn.textContent = 'Entrar';
    const tryLogin = async ()=>{
      const val = input.value.trim();
      if(!val) return;
      if(!state.pins.guardiaHash || !state.pins.adminHash){
        state.loginError = 'Conectando con la nube, espera un momento…';
        render();
        return;
      }
      let hash;
      try{
        hash = await sha256Hex(val);
      }catch(e){
        state.loginError = 'Este acceso solo funciona en el link https:// publicado.';
        render();
        return;
      }
      const guardia = state.guardias.find(g=>g.pinHash===hash);
      const administrativo = state.administrativos.find(a=>a.pinHash===hash);
      if(hash === state.pins.adminHash){
        state.session = {role:'admin'};
        localStorage.setItem('porteria_session', JSON.stringify(state.session));
        state.loginError = '';
        render();
      } else if(guardia){
        state.session = {role:'guardia', guardId: guardia.id, guardName: guardia.nombre};
        localStorage.setItem('porteria_session', JSON.stringify(state.session));
        state.loginError = '';
        render();
      } else if(administrativo){
        state.session = {role:'administrativo', nombre: administrativo.nombre};
        localStorage.setItem('porteria_session', JSON.stringify(state.session));
        state.loginError = '';
        render();
      } else if(hash === state.pins.guardiaHash){
        state.session = {role:'guardia', guardId:null, guardName:'Guardia'};
        localStorage.setItem('porteria_session', JSON.stringify(state.session));
        state.loginError = '';
        render();
      } else {
        state.loginError = 'PIN incorrecto.';
        render();
      }
    };
    btn.onclick = tryLogin;
    input.onkeydown = (e)=>{ if(e.key==='Enter') tryLogin(); };
    card.appendChild(input);
    card.appendChild(err);
    card.appendChild(btn);
    const ver = document.createElement('div');
    ver.className = 'lock-ver';
    ver.textContent = APP_VERSION;
    card.appendChild(ver);
    outer.appendChild(card);
    app.appendChild(outer);
    setTimeout(()=> input.focus(), 0);
  }

  function logout(){
    state.session = null;
    localStorage.removeItem('porteria_session');
    render();
  }

  const savedSession = localStorage.getItem('porteria_session');
  if(savedSession){
    try{
      const parsed = JSON.parse(savedSession);
      if(parsed && TABS_BY_ROLE[parsed.role]) state.session = parsed;
    }catch(e){}
  }

  bootstrapAndListen();
})();
</script>
